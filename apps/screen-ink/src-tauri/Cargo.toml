[package]
name = "screen-ink"
description = "screen-ink 단독 앱 — 플러그인 조립만 한다(03 §2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "screen_ink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: 맥 투명 창(섬·팝오버·오버레이). Windows에서는 아무 일도 하지 않는다.
tauri = { version = "2.10", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-screen-ink.workspace = true
log.workspace = true
