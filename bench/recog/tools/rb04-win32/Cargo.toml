[package]
name = "rb04-win32"
description = "RB-04 Win32 표준 컨트롤 시험 앱 — 컨트롤 사각형(물리 px)을 정답 JSON으로 쓴다(08 §5.1)"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

# 저장소 작업 공간에 넣지 않는 시험 도구(릴리스 패키지에 포함하지 않음, C §5)
[workspace]

[dependencies]
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
