<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>슉쇽 · 내 단축키 — 책상 옆 한 장</title>
    <link rel="stylesheet" href="../../../../../../node_modules/@fontsource/ibm-plex-sans-kr/400.css" />
    <link rel="stylesheet" href="../../../../../../node_modules/@fontsource/ibm-plex-sans-kr/500.css" />
    <link rel="stylesheet" href="../../../../../../node_modules/@fontsource/ibm-plex-sans-kr/600.css" />
    <link rel="stylesheet" href="../../../../../../node_modules/@fontsource/ibm-plex-sans-kr/700.css" />
    <link rel="stylesheet" href="../../../../../../node_modules/@fontsource/ibm-plex-mono/500.css" />
    <link rel="stylesheet" href="../../../../../../node_modules/@fontsource/ibm-plex-mono/600.css" />
    <link rel="stylesheet" href="../../../../../../node_modules/@fontsource/ibm-plex-mono/700.css" />
    <style>
      @font-face {
        font-family: 'Paperlogy';
        src: url('file:///Users/bodyking/Desktop/Architecture/fonts/Paperlogy-6SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: 'Paperlogy';
        src: url('file:///Users/bodyking/Desktop/Architecture/fonts/Paperlogy-7Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: 'Paperlogy';
        src: url('file:///Users/bodyking/Desktop/Architecture/fonts/Paperlogy-8ExtraBold.woff2') format('woff2');
        font-weight: 800;
        font-style: normal;
      }

      @page {
        size: A4 landscape;
        margin: 0;
      }

      :root {
        --bg: #ffffff;
        --ink: #0f0f10;
        --ink-2: #28282a;
        --sub: #4d4d52;
        --line: #222225;
        --hair: #dcdcd8;
        --surface: #f4f4f0;
        --accent: #ff9f0a;
        --accent-deep: #b45d00;
        --font-display: 'Paperlogy', 'IBM Plex Sans KR', sans-serif;
        --font-sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;
        --font-mono: 'IBM Plex Mono', 'IBM Plex Sans KR', monospace;
        --font-sym: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Menlo', 'Apple Symbols', sans-serif;
      }

      * {
        box-sizing: border-box;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: var(--ink);
        font-family: var(--font-sans);
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: 297mm;
        height: 210mm;
        padding: 8.5mm 11mm 8mm;
        display: flex;
        flex-direction: column;
        gap: 3.6mm;
        overflow: hidden;
      }

      /* 상단 바 */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 2.2mm;
        border-bottom: 2px solid var(--ink);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 2.5mm;
      }

      .doc-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 16pt;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .badge-desk {
        font-family: var(--font-display);
        font-size: 8pt;
        font-weight: 700;
        background: var(--ink);
        color: #ffffff;
        padding: 0.7mm 2.4mm;
        border-radius: 1.2mm;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 4mm;
      }

      .legend-mod {
        display: inline-flex;
        align-items: center;
        gap: 1.3mm;
        font-size: 8.2pt;
        font-weight: 600;
      }

      .mod-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }

      .meta-text {
        font-family: var(--font-mono);
        font-size: 8.2pt;
        font-weight: 600;
        color: var(--sub);
      }

      /* 자주 쓰는 6개 초대형 히어로 */
      .hero-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 3.5mm;
      }

      .hero-card {
        background: #141416;
        color: #ffffff;
        border-radius: 2.5mm;
        padding: 2.8mm 3.2mm 2.8mm;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 2mm;
        border-top: 2.5px solid #303036;
      }

      .hero-card.is-mod {
        border-top-color: var(--accent);
      }

      .hero-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5mm;
      }

      .hero-name {
        display: inline-flex;
        align-items: center;
        gap: 1.5mm;
        font-family: var(--font-display);
        font-size: 10.5pt;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .hero-keys {
        display: flex;
        align-items: center;
        gap: 1.3mm;
      }

      .hero-keys kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 8mm;
        height: 7.4mm;
        padding: 0 2.3mm;
        border-radius: 1.4mm;
        background: #2b2b30;
        border: 1px solid #48484f;
        color: #ffffff;
        font-family: var(--font-mono);
        font-size: 11.5pt;
        font-weight: 700;
        line-height: 1;
      }

      .hero-card.is-mod .hero-keys kbd {
        background: #33240d;
        border-color: var(--accent);
        color: #ffbd59;
      }

      .hero-keys .plus-op { font-size: 7.5pt; font-weight: 600; color: var(--sub, #5e5e5b); padding: 0 0.4mm; }
      .sym {
        font-family: var(--font-sym);
        font-size: 12pt;
      }

      /* 하단 3열 고대비 목록 */
      .cols {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 0.98fr 1.28fr 0.94fr;
        gap: 5.5mm;
      }

      .col {
        display: flex;
        flex-direction: column;
        gap: 2.6mm;
        min-width: 0;
      }

      .sec-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 1.1mm;
        border-bottom: 1.5px solid var(--ink);
        margin-bottom: 0.6mm;
      }

      .sec-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 10pt;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .sec-tag {
        font-size: 7.2pt;
        font-weight: 700;
        color: var(--sub);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2mm;
        padding: 0.65mm 0;
        border-bottom: 0.6px solid var(--hair);
      }

      .row:last-child {
        border-bottom: 0;
      }

      .row-label {
        display: inline-flex;
        align-items: center;
        gap: 1.3mm;
        font-size: 8.6pt;
        font-weight: 500;
        color: var(--ink-2);
        line-height: 1.2;
      }

      .row.is-mod .row-label {
        font-weight: 700;
        color: var(--ink);
      }

      .keycaps {
        display: inline-flex;
        align-items: center;
        gap: 0.8mm;
        flex: none;
      }

      .col kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 4.8mm;
        height: 4.6mm;
        padding: 0 1.4mm;
        border-radius: 1mm;
        background: var(--surface);
        border: 1px solid #2b2b2f;
        box-shadow: 0 0.5mm 0 #2b2b2f;
        font-family: var(--font-mono);
        font-size: 7.7pt;
        font-weight: 700;
        color: var(--ink);
        line-height: 1;
        white-space: nowrap;
      }

      .col kbd.is-mod {
        background: #fff3df;
        border-color: var(--accent-deep);
        box-shadow: 0 0.5mm 0 var(--accent-deep);
        color: var(--accent-deep);
      }

      .col .plus-op { font-size: 7.5pt; font-weight: 600; color: var(--sub, #5e5e5b); padding: 0 0.4mm; }
      .sym {
        font-family: var(--font-sym);
        font-size: 8.3pt;
      }

      /* 색 6종 스트립 */
      .color-strip {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 1.5mm;
        padding: 1.5mm 1.8mm;
        background: var(--surface);
        border: 1px solid #cfcfca;
        border-radius: 1.6mm;
        margin-bottom: 0.6mm;
      }

      .color-pill {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8mm;
        font-size: 7.3pt;
        font-weight: 700;
      }

      .color-top {
        display: inline-flex;
        align-items: center;
        gap: 1mm;
      }

      .swatch {
        width: 2.8mm;
        height: 2.8mm;
        border-radius: 50%;
        border: 0.8px solid rgba(0, 0, 0, 0.25);
      }

      .draw-two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 4.5mm;
      }

      .note-pill {
        font-size: 7.6pt;
        font-weight: 600;
        color: var(--sub);
        background: var(--surface);
        padding: 0.2mm 1.5mm;
        border-radius: 1mm;
      }

      .tip-box {
        margin-top: auto;
        padding: 2mm 2.6mm;
        border: 1.2px solid var(--ink);
        border-radius: 1.6mm;
        background: var(--surface);
        font-size: 7.7pt;
        font-weight: 600;
        line-height: 1.35;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 1.5mm;
        border-top: 1px solid var(--ink);
        font-size: 7.4pt;
        font-weight: 600;
        color: var(--sub);
      }
    </style>
  </head>
  <body>
    <main class="page" id="app"></main>
    <script>
      const ICONS = {
        shortcuts:
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="6.5" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="14" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="17.5" cy="10" r="1" fill="currentColor" stroke="none"/><path d="M7.5 14h9"/></svg>',
        region:
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M12 8.8c1.4 1.8 2.2 2.9 2.2 3.9a2.2 2.2 0 0 1-4.4 0c0-1 .8-2.1 2.2-3.9z" fill="#FF9F0A" stroke="none"/></svg>',
        window:
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9h17"/><circle cx="6.2" cy="7" r="1" fill="#FF9F0A" stroke="none"/></svg>',
        record:
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4" fill="#FF5A5F" stroke="none"/></svg>',
        draw:
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5l4.5 4.5L9.5 19H5v-4.5z"/><path d="M13 6.5l4.5 4.5"/><circle cx="4.8" cy="20.4" r="1.5" fill="#FF9F0A" stroke="none"/></svg>',
        zoom:
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/><circle cx="10.5" cy="10.5" r="1.8" fill="#FF9F0A" stroke="none"/></svg>',
        board:
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="11.5" rx="1.5"/><path d="M8.5 20l2-4.5M15.5 20l-2-4.5"/><circle cx="16.4" cy="12" r="1.4" fill="#FF9F0A" stroke="none"/></svg>',
      };

      const SYMBOLS = new Set(['⌃', '⌥', '⇧', '⌘', '↑', '↓', '←', '→', '↩', '⇥']);
      const MAC_MAP = {
        Ctrl: '⌃',
        Option: '⌥',
        Alt: '⌥',
        Shift: '⇧',
        Cmd: '⌘',
        Up: '↑',
        Down: '↓',
        Enter: '↩',
        Tab: '⇥',
      };

      function toTokens(combo) {
        return combo ? combo.split('+').map((t) => MAC_MAP[t] || t) : [];
      }

      function renderKeycapList(tokens, mod = false) {
        return `<span class="keycaps">${tokens
          .map((tok) => {
            const cls = [mod ? 'is-mod' : '', SYMBOLS.has(tok) ? 'sym' : ''].filter(Boolean).join(' ');
            return `<kbd class="${cls}">${tok}</kbd>`;
          })
          .join('')}</span>`;
      }

      function renderRow(item, shortLabel) {
        const mod = Boolean(item.modified);
        return `<div class="row ${mod ? 'is-mod' : ''}">
          <span class="row-label">${mod ? '<span class="mod-dot"></span>' : ''}<span>${shortLabel || item.label}</span></span>
          ${renderKeycapList(toTokens(item.combo), mod)}
        </div>`;
      }

      function renderGestureRow(g) {
        const right = g.keys
          ? `<span class="keycaps">${g.keys
              .map((k) => {
                if (k === '+') return '<span class="plus-op">+</span>';
            if (k === '+') return '<span class="plus-op">+</span>'; if (k.includes('+')) return renderKeycapList(toTokens(k), false);
                const tok = MAC_MAP[k] || k;
                return `<kbd class="${SYMBOLS.has(tok) ? 'sym' : ''}">${tok}</kbd>`;
              })
              .join('')}</span>`
          : `<span class="note-pill">${g.note}</span>`;
        return `<div class="row"><span class="row-label"><span>${g.label}</span></span>${right}</div>`;
      }

      async function boot() {
        const data = window.__SHORTCUTS_DATA__ || (await fetch('./shortcuts.json').then((r) => r.json()));
        const active = data.shortcuts.filter((s) => s.combo && !s.windowsOnly);
        const byId = new Map(active.map((s) => [s.id, s]));

        const heroDefs = [
          { id: 'region', icon: 'region', title: '범위 캡처' },
          { id: 'window', icon: 'window', title: '창 캡처' },
          { id: 'record', icon: 'record', title: '화면 녹화' },
          { id: 'draw', icon: 'draw', title: '판서' },
          { id: 'zoom', icon: 'zoom', title: '실시간 확대' },
          { id: 'board', icon: 'board', title: '칠판' },
        ];

        const globalExtras = ['last', 'full', 'active', 'restore', 'pause', 'pin', 'pinToggle', 'timer']
          .map((id) => byId.get(id))
          .filter(Boolean);
        const captureMode = active.filter((s) => s.group === 'capture-mode');

        const drawColors = ['d-red', 'd-yellow', 'd-green', 'd-orange', 'd-blue', 'd-lime']
          .map((id) => byId.get(id))
          .filter(Boolean);
        const drawLeft = ['d-pen', 'd-marker', 'd-text', 'd-select', 'd-eraser', 'd-clear', 'd-spot', 'd-check', 'd-number', 'd-white', 'd-black']
          .map((id) => byId.get(id))
          .filter(Boolean);
        const drawRight = ['d-undo', 'd-redo', 'd-copy', 'd-save', 'd-restore', 'd-center', 'd-zin', 'd-zout', 'd-wup', 'd-wdown', 'd-help', 'd-exit']
          .map((id) => byId.get(id))
          .filter(Boolean);
        const zoomExit = byId.get('z-exit');

        document.getElementById('app').innerHTML = `
          <header class="header">
            <div class="brand">
              ${ICONS.shortcuts}
              <h1 class="doc-title">${data.meta.title}</h1>
              <span class="badge-desk">책상 옆 한 장 · 고대비</span>
            </div>
            <div class="header-right">
              <span class="legend-mod"><span class="mod-dot"></span>기본값에서 변경</span>
              <span class="meta-text">${data.meta.subtitle}</span>
            </div>
          </header>

          <section class="hero-grid">
            ${heroDefs
              .map((h) => {
                const s = byId.get(h.id);
                if (!s) return '';
                const mod = Boolean(s.modified);
                return `<div class="hero-card ${mod ? 'is-mod' : ''}">
                  <div class="hero-top">
                    <span class="hero-name">${ICONS[h.icon]}<span>${h.title}</span></span>
                    ${mod ? '<span class="mod-dot"></span>' : ''}
                  </div>
                  <div class="hero-keys">${renderKeycapList(toTokens(s.combo), mod)}</div>
                </div>`;
              })
              .join('')}
          </section>

          <div class="cols">
            <div class="col">
              <section>
                <div class="sec-head">
                  <h2 class="sec-title">캡처 화면 안</h2>
                  <span class="sec-tag">즉시 실행</span>
                </div>
                ${captureMode.map((s) => renderRow(s)).join('')}
              </section>
              <section>
                <div class="sec-head">
                  <h2 class="sec-title">전역 보조 · 빠른 동작</h2>
                  <span class="sec-tag">어디서나</span>
                </div>
                ${globalExtras.slice(0, 5).map((s) => renderRow(s)).join('')}
              </section>
            </div>

            <div class="col">
              <section>
                <div class="sec-head">
                  <h2 class="sec-title">판서 화면 안</h2>
                  <span class="sec-tag">도구 · 색 · 편집</span>
                </div>
                <div class="color-strip">
                  ${drawColors
                    .map(
                      (c) => `<div class="color-pill">
                        <span class="color-top"><span class="swatch" style="background:${c.colorHex}"></span>${c.label.replace('색: ', '')}</span>
                        ${renderKeycapList(toTokens(c.combo), false)}
                      </div>`
                    )
                    .join('')}
                </div>
                <div class="draw-two-col">
                  <div>${drawLeft.map((s) => renderRow(s)).join('')}</div>
                  <div>${drawRight.map((s) => renderRow(s)).join('')}</div>
                </div>
              </section>
            </div>

            <div class="col">
              <section>
                <div class="sec-head">
                  <h2 class="sec-title">끌어서 도형</h2>
                  <span class="sec-tag">판서 중</span>
                </div>
                ${data.gestures.draw.slice(0, 7).map(renderGestureRow).join('')}
              </section>

              <section>
                <div class="sec-head">
                  <h2 class="sec-title">실시간 확대 · 미세 조작</h2>
                  <span class="sec-tag">휠 중심</span>
                </div>
                ${zoomExit ? renderRow(zoomExit) : ''}
                ${data.gestures.zoom.map(renderGestureRow).join('')}
                ${data.gestures.capture.slice(0, 3).map(renderGestureRow).join('')}
              </section>

              <div class="tip-box">
                TIP · ${data.meta.fnNote}
              </div>
            </div>
          </div>

          <footer class="footer">
            <span>후속 예정(⌘ 없음 제외): ${globalExtras.slice(5).map((s) => `${s.label} ${toTokens(s.combo).join('')}`).join(' · ')}</span>
            <span class="meta-text">${data.meta.title} · ${data.meta.subtitle}</span>
          </footer>
        `;

        await document.fonts.ready;
        window.__RENDER_DONE__ = true;
      }

      boot();
    </script>
  </body>
</html>
