<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>최종 — 설정 캡처·녹화 (다크)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:9px;font-size:13px;color:#C9CCD3;border:0;background:none;width:100%;font-family:inherit;text-align:left}
.nav svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav.on{background:#2C2E35;color:#F7F8FA}
.gh{margin:0 4px 6px;font-size:11px;font-weight:500;letter-spacing:.04em;color:#8E939E}
.grp{background:#232429;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.r{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 14px;font-size:13px;color:#F7F8FA;border-top:1px solid #2C2E35}
.r:first-child{border-top:0}
.r .l{flex:1;white-space:nowrap}
.r small{font-size:11.5px;color:#8E939E;white-space:nowrap}
.mono{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.sw{width:32px;height:18px;border-radius:9px;position:relative;flex:none}
.sw i{position:absolute;top:2px;width:14px;height:14px;border-radius:50%}
.on1{background:#FF9F0A}.on1 i{right:2px;background:#111315}
.off1{background:#34363D}.off1 i{left:2px;background:#8E939E}
.seg{display:flex;padding:3px;border-radius:13px;background:#2C2E35;font-size:12px}
.seg span{padding:2px 11px;border-radius:10px;color:#C9CCD3;white-space:nowrap}
.seg .s{background:#F7F8FA;color:#111315;font-weight:500}
.b{height:24px;padding:0 10px;border-radius:12px;border:0;background:#2C2E35;color:#F7F8FA;font-family:inherit;font-size:12px}
</style>
</helmet>
<div style="width: 960px; height: 640px; position: relative; background: #2B2D33; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">
  <div role="dialog" aria-label="screen-ink 설정" style="position: absolute; left: 30px; top: 20px; width: 900px; height: 600px; border-radius: 18px; overflow: hidden; display: flex; background: #1C1D21; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 28px 80px rgba(0,0,0,.5)">

    <nav aria-label="설정 묶음" style="width: 196px; flex: none; box-sizing: border-box; padding: 18px 10px; background: #16171A; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px">
        <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F2F32"/><stop offset="1" stop-color="#141416"/></linearGradient></defs><rect width="64" height="64" rx="14.5" fill="url(#c1)"/><rect x=".5" y=".5" width="63" height="63" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity=".14"/><path d="M17 25v-5a3 3 0 0 1 3-3h5M39 17h5a3 3 0 0 1 3 3v5M47 39v5a3 3 0 0 1-3 3h-5M25 47h-5a3 3 0 0 1-3-3v-5" fill="none" stroke="#F2F2EE" stroke-width="3.6" stroke-linecap="round"/><path d="M32 22.5c4.2 5.2 6.5 8.5 6.5 11.3a6.5 6.5 0 0 1-13 0c0-2.8 2.3-6.1 6.5-11.3z" fill="#FF9F0A"/></svg>
        <div><p style="margin: 0; font-size: 13px; font-weight: 600; color: #F7F8FA">screen-ink</p><p class="mono" style="margin: 0; font-size: 10.5px; color: #8E939E">0.1.0</p></div>
      </div>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9"/></svg>단축키</button>
      <button type="button" class="nav on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M12 8.8c1.4 1.8 2.2 2.9 2.2 3.9a2.2 2.2 0 0 1-4.4 0c0-1 .8-2.1 2.2-3.9z" fill="#FF9F0A" stroke="none"/></svg>캡처·녹화</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M15 4.5l4.5 4.5L9.5 19H5v-4.5z"/><path d="M13 6.5l4.5 4.5"/></svg>판서·확대</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>일반</button>
      <div style="flex: 1"></div>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>정보</button>
    </nav>

    <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 20px 28px; display: flex; flex-direction: column; gap: 12px; position: relative">
      <button type="button" aria-label="닫기" style="position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 14px; border: 0; background: #26272C; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="#C9CCD3" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <h1 style="margin: 0 0 2px; font-size: 19px; font-weight: 600; color: #F7F8FA">캡처·녹화</h1>

      <section>
        <p class="gh">결과</p>
        <div class="grp">
          <div class="r"><span class="l">Enter · 더블클릭 하면</span><span class="seg"><span class="s">복사</span><span>저장</span><span>둘 다</span></span></div>
          <div class="r"><span class="l">마우스 커서도 찍기</span><small>캡처 중 ` 키</small><span class="sw off1"><i></i></span></div>
          <div class="r"><span class="l">찰칵 소리</span><span class="sw off1"><i></i></span></div>
        </div>
      </section>

      <section>
        <p class="gh">저장</p>
        <div class="grp">
          <div class="r"><span class="l">저장 폴더</span><small class="mono">…\Pictures\screen-ink</small><button type="button" class="b">열기</button><button type="button" class="b">바꾸기</button></div>
          <div class="r" style="min-height: 44px"><span class="l">파일 이름</span><span class="mono" style="font-size: 11.5px; color: #F7F8FA; background: #16171A; border-radius: 8px; padding: 4px 10px; box-shadow: inset 0 0 0 1px #2C2E35">수업_{yyyy}{MM}{dd}_{n}</span><small class="mono" style="color: #FFB340">→ 수업_20261125_001.png</small></div>
        </div>
      </section>

      <section>
        <p class="gh">스마트 인식</p>
        <div class="grp">
          <div class="r"><span class="l">UI 요소까지 찾기</span><small>끄면 창 단위만</small><span class="sw on1"><i></i></span></div>
          <div class="r"><span class="l">모서리 자석</span><small>Alt를 누르는 동안 끔</small><span class="sw on1"><i></i></span></div>
          <div class="r"><span class="l">찾지 않을 앱</span><span class="mono" style="font-size: 11px; color: #C9CCD3; background: #2C2E35; border-radius: 10px; padding: 2px 9px">licecap.exe ×</span><span style="font-size: 11.5px; color: #C9CCD3; background: #2C2E35; border-radius: 10px; padding: 2px 9px">느림 · 창 단위 자동</span><button type="button" class="b">추가</button></div>
        </div>
      </section>

      <section>
        <p class="gh">녹화</p>
        <div class="grp">
          <div class="r"><span class="l">부드러움</span><span class="seg"><span class="s">30 fps</span><span>60 fps</span></span></div>
          <div class="r"><span class="l">마이크 소리</span><small>처음 켤 때 장치 고르기</small><span class="sw off1"><i></i></span></div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
