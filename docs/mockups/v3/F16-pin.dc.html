  <div role="status" aria-label="섬 — 창 고정" style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px 0 14px; border-radius: 20px; background: #000000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 14px 36px rgba(0,0,0,.35); font-size: 13px; color: #F7F8FA; white-space: nowrap">

    <span style="width: 1px; height: 14px; background: #2C2E35"></span>
    <span class="k">Alt</span><span class="k">Shift</span><span class="k">D</span><span style="font-size: 12px; color: #8E939E">풀기</span>
