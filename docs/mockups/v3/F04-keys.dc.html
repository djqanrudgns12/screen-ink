<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>최종 — 설정 단축키 (라이트)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:6px;font-size:13px;color:#3A3A38;border:0;background:none;width:100%;font-family:inherit;text-align:left}
.nav svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav.on{background:#1A1A1A;color:#FAFAF8}
.gh{display:flex;align-items:baseline;margin:0 2px 6px;font-size:11px;font-weight:500;letter-spacing:.04em;color:#6B6B68}
.gh span{flex:1}.gh button{border:0;background:none;padding:0;font-family:inherit;font-size:11.5px;color:#9A5B00}
.grp{background:#FFFFFF;border-radius:8px;box-shadow:0 0 0 1px #DDDDD8}
.r{display:flex;align-items:center;height:32px;padding:0 12px;font-size:13px;color:#121212;border-top:1px solid #EDEDEA}
.r:first-child{border-top:0}
.r .l{flex:1;white-space:nowrap}
.r small{font-size:11px;color:#9A5B00;margin-right:10px;white-space:nowrap}
.k{display:flex;gap:3px}
.k kbd{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:11px;color:#3A3A38;background:#EFEFEC;border:1px solid #DDDDD8;border-radius:4px;padding:0 6px;line-height:19px;min-width:12px;text-align:center}
.r.rec{background:#FFF8EC}
.r.rec kbd{background:#FFFFFF;border-color:#C76400;color:#9A5B00}
.dot{width:6px;height:6px;border-radius:50%;background:#C76400;margin-right:8px}
</style>
</helmet>
<div style="width: 960px; height: 640px; position: relative; background: #D9D9D5; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">
  <div role="dialog" aria-label="screen-ink 설정" style="position: absolute; left: 30px; top: 20px; width: 900px; height: 600px; border-radius: 12px; overflow: hidden; display: flex; background: #F4F4F1; box-shadow: 0 0 0 1px #CFCFC9, 0 22px 56px rgba(0,0,0,.22)">

    <nav aria-label="설정 묶음" style="width: 196px; flex: none; box-sizing: border-box; padding: 16px 10px; background: #EAEAE6; border-right: 1px solid #DDDDD8; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px">
        <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="k1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F2F32"/><stop offset="1" stop-color="#141416"/></linearGradient></defs><rect width="64" height="64" rx="14.5" fill="url(#k1)"/><path d="M17 25v-5a3 3 0 0 1 3-3h5M39 17h5a3 3 0 0 1 3 3v5M47 39v5a3 3 0 0 1-3 3h-5M25 47h-5a3 3 0 0 1-3-3v-5" fill="none" stroke="#F2F2EE" stroke-width="3.6" stroke-linecap="round"/><path d="M32 22.5c4.2 5.2 6.5 8.5 6.5 11.3a6.5 6.5 0 0 1-13 0c0-2.8 2.3-6.1 6.5-11.3z" fill="#FF9F0A"/></svg>
        <div><p style="margin: 0; font-size: 13px; font-weight: 600; color: #121212">screen-ink</p><p style="margin: 0; font-family: 'IBM Plex Mono','IBM Plex Sans KR',monospace; font-size: 10.5px; color: #5E5E5B">0.1.0</p></div>
      </div>
      <button type="button" class="nav on" aria-current="page"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9"/></svg>단축키</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/></svg>캡처·녹화</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M15 4.5l4.5 4.5L9.5 19H5v-4.5z"/><path d="M13 6.5l4.5 4.5"/></svg>판서·확대</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>일반</button>
      <div style="flex: 1"></div>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>정보</button>
    </nav>

    <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 18px 26px; display: flex; flex-direction: column; gap: 12px; position: relative">
      <button type="button" aria-label="닫기" style="position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 6px; border: 0; background: none; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="#3A3A38" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <div style="display: flex; align-items: center; gap: 14px; padding-right: 34px">
        <h1 style="margin: 0; font-size: 19px; font-weight: 600; color: #121212; flex: 1">단축키</h1>
        <div role="tablist" aria-label="단축키 범위" style="display: flex; border-radius: 6px; box-shadow: 0 0 0 1px #CFCFC9; overflow: hidden">
          <button type="button" role="tab" aria-selected="true" style="border: 0; font-family: inherit; font-size: 12px; font-weight: 500; padding: 4px 12px; background: #1A1A1A; color: #FAFAF8">어디서나 <span style="font-family: 'IBM Plex Mono','IBM Plex Sans KR',monospace; color: #FF9F0A">16</span></button>
          <button type="button" role="tab" aria-selected="false" style="border: 0; font-family: inherit; font-size: 12px; padding: 4px 12px; background: #FFFFFF; color: #3A3A38">화면 안 <span style="font-family: 'IBM Plex Mono','IBM Plex Sans KR',monospace">43</span></button>
        </div>
      </div>

      <div role="status" style="display: flex; align-items: center; gap: 12px; padding: 7px 8px 7px 12px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 0 0 1px #DDDDD8">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C76400" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5l8.5 15h-17z"/><path d="M12 10.5v4M12 17h.01"/></svg>
        <p style="margin: 0; flex: 1; font-size: 12.5px; color: #121212; white-space: nowrap"><b style="font-weight: 600">Snipaste</b>가 F1·F3 키 4개를 먼저 쓰고 있어요</p>
        <button type="button" style="border: 0; font-family: inherit; font-size: 12px; font-weight: 500; height: 26px; padding: 0 10px; border-radius: 5px; background: #1A1A1A; color: #FAFAF8">끄는 법</button>
        <button type="button" style="border: 0; font-family: inherit; font-size: 12px; height: 26px; padding: 0 8px; border-radius: 5px; background: none; color: #3A3A38">키 바꾸기</button>
      </div>

      <section>
        <p class="gh"><span>캡처·녹화</span><button type="button">기본값</button></p>
        <div class="grp">
          <div class="r"><span class="l">범위 캡처</span><span class="dot"></span><span class="k"><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">창 캡처</span><span class="k"><kbd>F2</kbd></span></div>
          <div class="r"><span class="l">화면 녹화</span><span class="dot"></span><span class="k"><kbd>F3</kbd></span></div>
          <div class="r"><span class="l">직전 범위 바로 캡처</span><span class="dot"></span><span class="k"><kbd>Shift</kbd><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">모니터 전체 바로 캡처</span><span class="dot"></span><span class="k"><kbd>Ctrl</kbd><kbd>F1</kbd></span></div>
          <div class="r rec"><span class="l">활성 창 바로 캡처</span><small>키를 누르세요 · Esc 취소</small><span class="k"><kbd>Shift</kbd><kbd>F2</kbd></span></div>
          <div class="r"><span class="l">지연 캡처</span><span class="k"><kbd>Alt</kbd><kbd>F1</kbd></span></div>
        </div>
      </section>

      <section>
        <p class="gh"><span>화면 도구</span><button type="button">기본값</button></p>
        <div class="grp">
          <div class="r"><span class="l">판서</span><span class="k"><kbd>Alt</kbd><kbd>1</kbd></span></div>
          <div class="r"><span class="l">실시간 확대</span><span class="k"><kbd>Alt</kbd><kbd>2</kbd></span></div>
          <div class="r"><span class="l">칠판</span><span class="k"><kbd>Alt</kbd><kbd>3</kbd></span></div>
          <div class="r"><span class="l">창 항상 위</span><span class="k"><kbd>Alt</kbd><kbd>Shift</kbd><kbd>D</kbd></span></div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
