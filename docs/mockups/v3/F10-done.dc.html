<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #E9EBEF; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">

    <p style="position: absolute; left: 40px; top: 52px; margin: 0; font-size: 26px; font-weight: 700; color: #1D1D1F">3. 분수의 나눗셈</p>
    <p style="position: absolute; left: 40px; top: 104px; margin: 0; font-size: 15px; color: #3A3A3C">나누는 수를 뒤집어 곱하면 됩니다. 아래 표로 차례를 확인해 봅시다.</p>
    <div style="position: absolute; left: 40px; top: 160px; width: 720px; border: 1px solid #E5E5EA; border-radius: 8px; overflow: hidden">

    <div style="position: absolute; left: 40px; top: 360px; width: 340px; height: 120px; border-radius: 8px; background: #F5F5F7"></div>
    <div style="position: absolute; left: 400px; top: 360px; width: 360px; height: 120px; border-radius: 8px; background: #F5F5F7"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 121px; top: 237px; width: 718px; height: 40px; outline: 2px solid rgba(255,159,10,.35); border-radius: 2px"></div>

  <div role="status" aria-label="섬 — 결과" style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: 500px; box-sizing: border-box; padding: 8px 8px 11px; border-radius: 24px; background: #000000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 14px 36px rgba(0,0,0,.4); display: flex; flex-direction: column; gap: 8px; overflow: hidden">

      <button type="button" class="chip" style="background: #2C2E35; color: #F7F8FA">판서로 <kbd>Alt 1</kbd></button>
