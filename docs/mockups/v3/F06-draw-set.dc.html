<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>최종 — 설정 판서·확대 (라이트)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:6px;font-size:13px;color:#3A3A38;border:0;background:none;width:100%;font-family:inherit;text-align:left}
.nav svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav.on{background:#1A1A1A;color:#FAFAF8}
.gh{margin:0 2px 5px;font-size:11px;font-weight:500;letter-spacing:.04em;color:#6B6B68}
.grp{background:#FFFFFF;border-radius:8px;box-shadow:0 0 0 1px #DDDDD8}
.r{display:flex;align-items:center;gap:10px;height:31px;padding:0 12px;font-size:13px;color:#121212;border-top:1px solid #EDEDEA}
.r:first-child{border-top:0}
.r .l{flex:1;white-space:nowrap}
.r small{font-size:11.5px;color:#6B6B68;white-space:nowrap}
.mono{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.sw{width:30px;height:17px;border-radius:9px;position:relative;flex:none}
.sw i{position:absolute;top:2px;width:13px;height:13px;border-radius:50%}
.on1{background:#1A1A1A}.on1 i{right:2px;background:#FF9F0A}
.off1{background:#DDDDD8}.off1 i{left:2px;background:#FFFFFF}
.seg{display:flex;border-radius:5px;box-shadow:0 0 0 1px #CFCFC9;overflow:hidden;font-size:11.5px}
.seg span{padding:2px 9px;background:#FFFFFF;color:#3A3A38;border-left:1px solid #E4E4E0;white-space:nowrap}
.seg span:first-child{border-left:0}
.seg .s{background:#1A1A1A;color:#FAFAF8;border-left-color:#1A1A1A}
.pc{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:9.5px;color:#FFFFFF}
</style>
</helmet>
<div style="width: 960px; height: 640px; position: relative; background: #D9D9D5; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">
  <div role="dialog" aria-label="screen-ink 설정" style="position: absolute; left: 30px; top: 20px; width: 900px; height: 600px; border-radius: 12px; overflow: hidden; display: flex; background: #F4F4F1; box-shadow: 0 0 0 1px #CFCFC9, 0 22px 56px rgba(0,0,0,.22)">

    <nav aria-label="설정 묶음" style="width: 196px; flex: none; box-sizing: border-box; padding: 16px 10px; background: #EAEAE6; border-right: 1px solid #DDDDD8; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px">
        <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F2F32"/><stop offset="1" stop-color="#141416"/></linearGradient></defs><rect width="64" height="64" rx="14.5" fill="url(#d1)"/><path d="M17 25v-5a3 3 0 0 1 3-3h5M39 17h5a3 3 0 0 1 3 3v5M47 39v5a3 3 0 0 1-3 3h-5M25 47h-5a3 3 0 0 1-3-3v-5" fill="none" stroke="#F2F2EE" stroke-width="3.6" stroke-linecap="round"/><path d="M32 22.5c4.2 5.2 6.5 8.5 6.5 11.3a6.5 6.5 0 0 1-13 0c0-2.8 2.3-6.1 6.5-11.3z" fill="#FF9F0A"/></svg>
        <div><p style="margin: 0; font-size: 13px; font-weight: 600; color: #121212">screen-ink</p><p class="mono" style="margin: 0; font-size: 10.5px; color: #5E5E5B">0.1.0</p></div>
      </div>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9"/></svg>단축키</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/></svg>캡처·녹화</button>
      <button type="button" class="nav on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M15 4.5l4.5 4.5L9.5 19H5v-4.5z"/><path d="M13 6.5l4.5 4.5"/><circle cx="4.8" cy="20.4" r="1.5" fill="#D97706" stroke="none"/></svg>판서·확대</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>일반</button>
      <div style="flex: 1"></div>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>정보</button>
    </nav>

    <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 18px 26px; display: flex; flex-direction: column; gap: 10px; position: relative">
      <button type="button" aria-label="닫기" style="position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 6px; border: 0; background: none; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="#3A3A38" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <h1 style="margin: 0 0 2px; font-size: 19px; font-weight: 600; color: #121212">판서·확대</h1>

      <section>
        <p class="gh">펜</p>
        <div class="grp">
          <div class="r"><span class="l">처음 색</span>
            <span style="display: flex; gap: 6px"><span class="pc" style="background: #E5484D; color: #121212; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3.5px #121212">R</span><span class="pc" style="background: #F2B705; color: #121212">Y</span><span class="pc" style="background: #2BA36B; color: #121212">G</span><span class="pc" style="background: #F97316; color: #121212">O</span><span class="pc" style="background: #2F6FED">B</span><span class="pc" style="background: #84CC16; color: #121212">L</span></span></div>
          <div class="r"><span class="l">굵기</span><small>Ctrl+휠</small>
            <span style="position: relative; width: 150px; height: 4px; border-radius: 2px; background: #DDDDD8"><span style="position: absolute; left: 0; top: 0; width: 30px; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="position: absolute; left: 24px; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px #CFCFC9, 0 1px 3px rgba(0,0,0,.2)"></span></span>
            <span class="mono" style="font-size: 11.5px; min-width: 28px; text-align: right">4px</span></div>
        </div>
      </section>

      <section>
        <p class="gh">보정</p>
        <div class="grp">
          <div class="r"><span class="l">떨림 보정</span><span class="seg"><span>끔</span><span class="s">약</span><span>강</span></span></div>
          <div class="r"><span class="l">거의 곧은 선은 곧게</span><small class="mono">±4°</small><span class="sw on1"><i></i></span></div>
          <div class="r"><span class="l">멈추면 도형으로</span><small>0.5초 · Ctrl+Z = 원래 획</small><span class="sw on1"><i></i></span></div>
        </div>
      </section>

      <section>
        <p class="gh">판서</p>
        <div class="grp">
          <div class="r"><span class="l">첫 휠 배율</span><span class="seg mono"><span>1.25</span><span>1.5</span><span class="s">1.75</span><span>2</span><span>3</span></span></div>
          <div class="r"><span class="l">나갈 때 보관</span><small>Alt+Shift+1로 다시 열기</small><span class="sw on1"><i></i></span></div>
          <div class="r"><span class="l">Esc 키</span><span class="seg"><span class="s">한 단계씩</span><span>바로 나가기</span></span></div>
          <div class="r"><span class="l">확대 중 오른쪽 클릭</span><small>손 모드 · 아니면 끝내기</small><span class="sw on1"><i></i></span></div>
        </div>
      </section>

      <section>
        <p class="gh">실시간 확대</p>
        <div class="grp">
          <div class="r"><span class="l">커서 따라가기</span><span class="seg"><span class="s">부드럽게</span><span>바로</span></span></div>
          <div class="r"><span class="l">위치 지도 보이기</span><small>모서리에 작게</small><span class="sw on1"><i></i></span></div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
