<!doctype html>
<html lang="ko">

</head>
<body>
<x-dc>
<helmet>

<style>

.hint span{display:inline-flex;align-items:center;white-space:nowrap}
.hd{position:absolute;width:8px;height:8px;background:#FFFFFF;border:2px solid #D97706;border-radius:2px;box-sizing:border-box}
</style>
</helmet>
<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #E9EBEF; font-family: 'Noto Sans KR', system-ui, sans-serif">

    <p style="position: absolute; left: 40px; top: 92px; margin: 0; font-size: 15px; color: #3A3A3C">나누는 수를 뒤집어 곱하면 됩니다. 아래 표로 차례를 확인해 봅시다.</p>
    <div style="position: absolute; left: 40px; top: 160px; width: 720px; border: 1px solid #E5E5EA; border-radius: 8px; overflow: hidden">
      <div class="td" style="border-top: 0; background: #F5F5F7; font-weight: 500"><span>식</span><span>바꾸기</span><span>답</span></div>

      <div class="td"><span>5/6 ÷ 5/12</span><span>5/6 × 12/5</span><span>2</span></div>
    </div>
    <div style="position: absolute; left: 40px; top: 360px; width: 340px; height: 120px; border-radius: 8px; background: #F5F5F7"></div>
    <div style="position: absolute; left: 400px; top: 360px; width: 360px; height: 120px; border-radius: 8px; background: #F5F5F7"></div>
  </div>

  <div aria-label="고른 범위" style="position: absolute; left: 121px; top: 237px; width: 718px; height: 40px; outline: 2px solid #D97706; box-shadow: 0 0 0 9999px rgba(40,32,20,.38)"></div>
  <span class="hd" style="left: 117px; top: 233px"></span><span class="hd" style="left: 835px; top: 233px"></span><span class="hd" style="left: 117px; top: 273px"></span><span class="hd" style="left: 835px; top: 273px"></span>

  <div style="position: absolute; left: 121px; top: 203px; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: 7px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3DDD0, 0 4px 10px rgba(60,45,20,.14); font-size: 12px; color: #1F1E1C; white-space: nowrap">
    <span style="color: #6F6B64">창 › 표 ›</span><span style="font-weight: 700">2행</span>
    <span style="width: 1px; height: 12px; background: #E3DDD0"></span>

  <div aria-label="확대경" style="position: absolute; left: 584px; top: 282px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <div style="width: 96px; height: 96px; border-radius: 50%; overflow: hidden; position: relative; background: #FFFFFF; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 4px #E3DDD0, 0 8px 20px rgba(60,45,20,.22)">

    </div>

  <div class="hint" style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 18px; align-items: center; height: 40px; padding: 0 16px; border-radius: 10px; background: #FAF8F4; box-shadow: 0 0 0 1px #E3DDD0, 0 8px 22px rgba(60,45,20,.2); font-size: 12.5px; color: #3F3B35">

    <span><kbd>Tab</kbd>창 단위</span>
    <span><kbd>Enter</kbd>복사</span>
    <span><kbd>Esc</kbd>취소</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>

}

</body>
</html>
