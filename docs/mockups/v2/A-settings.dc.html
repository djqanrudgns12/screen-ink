<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A 클리어 — 설정 단축키</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;font-size:13px;color:#1D1D1F;border:0;background:none;width:100%;font-family:inherit;text-align:left}
.nav.on{background:#0A7CFF;color:#FFFFFF}
.tile{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none}
.tile svg{width:13px;height:13px;fill:none;stroke:#FFFFFF;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.gh{margin:0 0 6px 12px;font-size:12px;font-weight:500;color:#6E6E73}
.grp{background:#FFFFFF;border-radius:10px;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
.r{display:flex;align-items:center;height:34px;padding:0 12px;font-size:13.5px;color:#1D1D1F;border-top:1px solid #F0F0F2}
.r:first-child{border-top:0}
.r .l{flex:1;white-space:nowrap}
.k{display:flex;gap:4px}
.k kbd{font-family:inherit;font-size:11.5px;font-weight:500;color:#3A3A3C;background:#F2F2F7;border:1px solid #E0E0E6;border-bottom-width:1.5px;border-radius:6px;padding:1px 7px;min-width:12px;text-align:center}
.dot{width:7px;height:7px;border-radius:50%;background:#FF9F0A;margin-right:8px}
</style>
</helmet>
<div style="width: 960px; height: 640px; position: relative; background: #DDE2E8; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div role="dialog" aria-label="screen-ink 설정" style="position: absolute; left: 30px; top: 20px; width: 900px; height: 600px; border-radius: 12px; overflow: hidden; display: flex; background: #F5F5F7; box-shadow: 0 0 0 .5px rgba(0,0,0,.16), 0 24px 70px rgba(17,24,39,.25)">

    <nav aria-label="설정 묶음" style="width: 214px; flex: none; box-sizing: border-box; padding: 16px 10px; background: rgba(232,233,237,.85); border-right: 1px solid rgba(0,0,0,.06); display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px">
        <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#FFFFFF"/><rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#000" stroke-opacity=".1"/><path d="M18 24v-4a2 2 0 0 1 2-2h4M40 18h4a2 2 0 0 1 2 2v4M46 40v4a2 2 0 0 1-2 2h-4M24 46h-4a2 2 0 0 1-2-2v-4" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round"/><path d="M22 38c5-9 9 3 14-5s7-3 8-1" fill="none" stroke="#0A7CFF" stroke-width="4" stroke-linecap="round"/></svg>
        <div><p style="margin: 0; font-size: 13.5px; font-weight: 700; color: #1D1D1F">screen-ink</p><p style="margin: 0; font-size: 11px; color: #6E6E73">0.1 · 1차</p></div>
      </div>
      <button type="button" class="nav on" aria-current="page"><span class="tile" style="background: #FFFFFF"><svg viewBox="0 0 24 24" style="stroke: #0A7CFF"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M7 14h10M6 10h.01M10 10h.01M14 10h.01M18 10h.01"/></svg></span>단축키</button>
      <button type="button" class="nav"><span class="tile" style="background: #FF9F0A"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg></span>캡처·녹화</button>
      <button type="button" class="nav"><span class="tile" style="background: #BF5AF2"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>판서·확대</button>
      <button type="button" class="nav"><span class="tile" style="background: #8E8E93"><svg viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></span>일반</button>
      <div style="flex: 1"></div>
      <button type="button" class="nav"><span class="tile" style="background: #C7C7CC"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>정보</button>
    </nav>

    <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 20px 28px; display: flex; flex-direction: column; gap: 14px; position: relative">
      <button type="button" aria-label="닫기" style="position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 13px; border: 0; background: rgba(0,0,0,.05); display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="#6E6E73" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div style="display: flex; align-items: center; gap: 14px; padding-right: 34px">
        <h1 style="margin: 0; font-size: 20px; font-weight: 700; color: #1D1D1F; flex: 1">단축키</h1>
        <div role="tablist" aria-label="단축키 범위" style="display: flex; padding: 2px; border-radius: 8px; background: #E3E3E8">
          <button type="button" role="tab" aria-selected="true" style="border: 0; font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 4px 14px; border-radius: 6px; background: #FFFFFF; color: #1D1D1F; box-shadow: 0 1px 2px rgba(0,0,0,.12)">어디서나 16</button>
          <button type="button" role="tab" aria-selected="false" style="border: 0; font-family: inherit; font-size: 12.5px; padding: 4px 14px; border-radius: 6px; background: none; color: #3A3A3C">화면 안 43</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: #FFF5E6; box-shadow: 0 0 0 .5px rgba(255,159,10,.45)">
        <span class="dot" style="margin: 0"></span>
        <p style="margin: 0; flex: 1; font-size: 13px; color: #1D1D1F; white-space: nowrap">Snipaste가 F1 키 4개를 먼저 쓰고 있어요</p>
        <button type="button" style="border: 0; font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 5px 12px; border-radius: 7px; background: #FFFFFF; color: #1D1D1F; box-shadow: 0 0 0 .5px rgba(0,0,0,.15)">Snipaste 끄는 법</button>
      </div>

      <section>
        <p class="gh">캡처</p>
        <div class="grp">
          <div class="r"><span class="l">범위 캡처</span><span class="dot"></span><span class="k"><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">창 캡처</span><span class="k"><kbd>F2</kbd></span></div>
          <div class="r"><span class="l">화면 녹화</span><span class="k"><kbd>F3</kbd></span></div>
          <div class="r"><span class="l">직전 범위 바로 캡처</span><span class="dot"></span><span class="k"><kbd>Shift</kbd><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">모니터 전체 바로 캡처</span><span class="dot"></span><span class="k"><kbd>Ctrl</kbd><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">활성 창 바로 캡처</span><span class="k"><kbd>Shift</kbd><kbd>F2</kbd></span></div>
          <div class="r"><span class="l">지연 캡처</span><span class="k"><kbd>Alt</kbd><kbd>F1</kbd></span></div>
        </div>
      </section>

      <section>
        <p class="gh">화면 도구</p>
        <div class="grp">
          <div class="r"><span class="l">판서</span><span class="k"><kbd>Alt</kbd><kbd>1</kbd></span></div>
          <div class="r"><span class="l">실시간 확대</span><span class="k"><kbd>Alt</kbd><kbd>2</kbd></span></div>
          <div class="r"><span class="l">칠판</span><span class="k"><kbd>Alt</kbd><kbd>3</kbd></span></div>
          <div class="r"><span class="l">직전 판서 열기</span><span class="k"><kbd>Alt</kbd><kbd>Shift</kbd><kbd>1</kbd></span></div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
