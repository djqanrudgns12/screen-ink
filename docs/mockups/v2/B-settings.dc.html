<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>B 아일랜드 — 설정 단축키</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:10px;font-size:13px;color:#C9CCD3;border:0;background:none;width:100%;font-family:inherit;text-align:left}
.nav svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav.on{background:#2C2E35;color:#F7F8FA}
.gh{margin:0 0 6px 12px;font-size:12px;color:#8E939E}
.grp{background:#232429;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.r{display:flex;align-items:center;height:36px;padding:0 14px;font-size:13.5px;color:#F7F8FA;border-top:1px solid #2C2E35}
.r:first-child{border-top:0}
.r .l{flex:1;white-space:nowrap}
.k{display:flex;gap:4px}
.k kbd{font-family:inherit;font-size:11.5px;font-weight:500;color:#F7F8FA;background:#34363D;border-radius:7px;padding:2px 8px;min-width:12px;text-align:center}
.dot{width:7px;height:7px;border-radius:50%;background:#FF9F0A;margin-right:10px}
</style>
</helmet>
<div style="width: 960px; height: 640px; position: relative; background: #CDD2D9; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div role="dialog" aria-label="screen-ink 설정" style="position: absolute; left: 30px; top: 20px; width: 900px; height: 600px; border-radius: 18px; overflow: hidden; display: flex; background: #1C1D21; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 28px 80px rgba(0,0,0,.4)">

    <nav aria-label="설정 묶음" style="width: 200px; flex: none; box-sizing: border-box; padding: 18px 10px; background: #16171A; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px">
        <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#000"/><rect x="14" y="14" width="36" height="12" rx="6" fill="#F5F5F7"/><circle cx="44" cy="20" r="3" fill="#FFD60A"/><path d="M20 44c4-6 8 2 12-3s6-2 8 0" fill="none" stroke="#F5F5F7" stroke-opacity=".5" stroke-width="3.5" stroke-linecap="round"/></svg>
        <div><p style="margin: 0; font-size: 13.5px; font-weight: 700; color: #F7F8FA">screen-ink</p><p style="margin: 0; font-size: 11px; color: #8E939E">0.1 · 1차</p></div>
      </div>
      <button type="button" class="nav on" aria-current="page"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M7 14h10M6 10h.01M10 10h.01M14 10h.01M18 10h.01"/></svg>단축키</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>캡처·녹화</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>판서·확대</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>일반</button>
      <div style="flex: 1"></div>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>정보</button>
    </nav>

    <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 22px 30px; display: flex; flex-direction: column; gap: 14px; position: relative">
      <button type="button" aria-label="닫기" style="position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 14px; border: 0; background: #26272C; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="#C9CCD3" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div style="display: flex; align-items: center; gap: 14px; padding-right: 40px">
        <h1 style="margin: 0; font-size: 20px; font-weight: 700; color: #F7F8FA; flex: 1">단축키</h1>
        <div role="tablist" aria-label="단축키 범위" style="display: flex; padding: 3px; border-radius: 16px; background: #26272C">
          <button type="button" role="tab" aria-selected="true" style="border: 0; font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 4px 14px; border-radius: 13px; background: #F7F8FA; color: #111315">어디서나 16</button>
          <button type="button" role="tab" aria-selected="false" style="border: 0; font-family: inherit; font-size: 12.5px; padding: 4px 14px; border-radius: 13px; background: none; color: #C9CCD3">화면 안 43</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 14px; background: rgba(255,159,10,.1); box-shadow: inset 0 0 0 1px rgba(255,159,10,.28)">
        <span class="dot" style="margin: 0"></span>
        <p style="margin: 0; flex: 1; font-size: 13px; color: #F7F8FA; white-space: nowrap">Snipaste가 F1 키 4개를 먼저 쓰고 있어요</p>
        <button type="button" style="border: 0; font-family: inherit; font-size: 12.5px; font-weight: 500; height: 28px; padding: 0 12px; border-radius: 14px; background: #F7F8FA; color: #111315">Snipaste 끄는 법</button>
      </div>

      <section>
        <p class="gh">캡처</p>
        <div class="grp">
          <div class="r"><span class="l">범위 캡처</span><span class="dot"></span><span class="k"><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">창 캡처</span><span class="k"><kbd>F2</kbd></span></div>
          <div class="r"><span class="l">화면 녹화</span><span class="k"><kbd>F3</kbd></span></div>
          <div class="r"><span class="l">직전 범위 바로 캡처</span><span class="dot"></span><span class="k"><kbd>Shift</kbd><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">모니터 전체 바로 캡처</span><span class="dot"></span><span class="k"><kbd>Ctrl</kbd><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">활성 창 바로 캡처</span><span class="k"><kbd>Shift</kbd><kbd>F2</kbd></span></div>
          <div class="r"><span class="l">지연 캡처</span><span class="k"><kbd>Alt</kbd><kbd>F1</kbd></span></div>
        </div>
      </section>

      <section>
        <p class="gh">화면 도구</p>
        <div class="grp">
          <div class="r"><span class="l">판서</span><span class="k"><kbd>Alt</kbd><kbd>1</kbd></span></div>
          <div class="r"><span class="l">실시간 확대</span><span class="k"><kbd>Alt</kbd><kbd>2</kbd></span></div>
          <div class="r"><span class="l">칠판</span><span class="k"><kbd>Alt</kbd><kbd>3</kbd></span></div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
