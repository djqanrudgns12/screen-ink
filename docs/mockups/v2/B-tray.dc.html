<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>B 아일랜드 — 트레이 팝오버</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.tl{display:flex;flex-direction:column;justify-content:space-between;height:74px;padding:10px;border-radius:14px;background:#26272C;border:0;font-family:inherit;text-align:left;box-sizing:border-box;color:#F7F8FA}
.tl .top{display:flex;justify-content:space-between;align-items:center}
.tl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tl .k{font-size:11px;color:#8E939E}
.tl .n{font-size:12.5px;font-weight:500;white-space:nowrap}
.tl.on{background:#F7F8FA;color:#111315}.tl.on .k{color:#666B73}
.hd{margin:12px 8px 4px;font-size:11px;color:#8E939E}
.row{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:9px;font-size:13.5px;color:#F7F8FA;border:0;background:none;width:100%;font-family:inherit;text-align:left;box-sizing:border-box}
.row svg{width:16px;height:16px;flex:none;fill:none;stroke:#C9CCD3;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row .l{flex:1;white-space:nowrap}
.row .k{font-size:12px;color:#8E939E}
.sep{height:1px;background:#2C2E35;margin:8px 8px}
</style>
</helmet>
<div style="width: 720px; height: 560px; position: relative; overflow: hidden; background: #CDD2D9; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: rgba(242,243,245,.9); border-top: 1px solid rgba(0,0,0,.06); display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 16px">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #9AA0A9"></span>
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #9AA0A9"></span>
    <span style="width: 30px; height: 30px; border-radius: 10px; background: #111315; display: grid; place-items: center">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="5.5" width="13" height="7" rx="3.5" fill="none" stroke="#F7F8FA" stroke-width="1.6"/><circle cx="12" cy="9" r="1.6" fill="#FFD60A"/></svg>
    </span>
    <span style="font-size: 12.5px; color: #111315; font-variant-numeric: tabular-nums">10:31</span>
  </div>

  <div role="menu" aria-label="screen-ink 메뉴" style="position: absolute; right: 14px; bottom: 56px; width: 296px; box-sizing: border-box; padding: 10px; border-radius: 22px; background: rgba(22,23,26,.94); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 24px 60px rgba(0,0,0,.35)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px">
      <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#000"/><rect x="14" y="14" width="36" height="12" rx="6" fill="#F5F5F7"/><circle cx="44" cy="20" r="3" fill="#FFD60A"/><path d="M20 44c4-6 8 2 12-3s6-2 8 0" fill="none" stroke="#F5F5F7" stroke-opacity=".5" stroke-width="3.5" stroke-linecap="round"/></svg>
      <p style="margin: 0; flex: 1; font-size: 14px; font-weight: 700; color: #F7F8FA">screen-ink</p>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8E939E"><span style="width: 6px; height: 6px; border-radius: 50%; background: #34C759"></span>준비됨</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <button type="button" class="tl on"><span class="top"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg><span class="k">F1</span></span><span class="n">범위 캡처</span></button>
      <button type="button" class="tl"><span class="top"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg><span class="k">F2</span></span><span class="n">창 캡처</span></button>
      <button type="button" class="tl"><span class="top"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="#FF453A" stroke="none"/></svg><span class="k">F3</span></span><span class="n">화면 녹화</span></button>
    </div>

    <p class="hd">화면 도구</p>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="l">판서</span><span class="k">Alt+1</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg><span class="l">실시간 확대</span><span class="k">Alt+2</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg><span class="l">칠판</span><span class="k">Alt+3</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3H7l3-3z"/><path d="M12 12v8"/></svg><span class="l">창 항상 위</span><span class="k">Alt+Shift+D</span></button>

    <p class="hd">빠른 동작</p>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span class="l">직전 판서 열기</span><span class="k">Alt+Shift+1</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="l">저장 폴더 열기</span></button>

    <div class="sep"></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 2px">
      <button type="button" role="switch" aria-checked="true" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 16px; border: 0; background: #26272C; color: #F7F8FA; font-family: inherit; font-size: 12.5px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #34C759"></span>단축키 켜짐</button>
      <button type="button" style="height: 32px; padding: 0 14px; border-radius: 16px; border: 0; background: #26272C; color: #F7F8FA; font-family: inherit; font-size: 12.5px">설정</button>
      <button type="button" style="height: 32px; padding: 0 14px; border-radius: 16px; border: 0; background: none; color: #8E939E; font-family: inherit; font-size: 12.5px">끝내기</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
