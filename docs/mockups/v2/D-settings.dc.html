<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>D 젤리 — 설정 단축키</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:10px;height:38px;padding:0 8px;border-radius:14px;font-size:13.5px;font-weight:500;color:#3D3A57;border:0;background:none;width:100%;font-family:inherit;text-align:left}
.nav .c{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:#EEECF6}
.nav svg{width:15px;height:15px;fill:none;stroke:#6B6789;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.nav.on{background:#FFFFFF;color:#24223A;box-shadow:0 4px 14px rgba(76,60,160,.12)}
.nav.on .c{background:#7C5CFF}.nav.on svg{stroke:#FFFFFF}
.gh{margin:0 0 7px 6px;font-size:12px;font-weight:700;color:#6B6789}
.grp{background:#FFFFFF;border-radius:18px;box-shadow:0 0 0 1px #ECEAF5,0 6px 18px rgba(76,60,160,.06);padding:4px 0}
.r{display:flex;align-items:center;height:34px;padding:0 16px;font-size:13.5px;color:#24223A}
.r .l{flex:1;white-space:nowrap}
.k{display:flex;gap:4px}
.k kbd{font-family:inherit;font-size:11.5px;font-weight:500;color:#3D3A57;background:#F3F2F9;border-radius:8px;padding:2px 9px}
.dot{width:7px;height:7px;border-radius:50%;background:#E86A33;margin-right:10px}
</style>
</helmet>
<div style="width: 960px; height: 640px; position: relative; background: #E4E2EE; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div role="dialog" aria-label="screen-ink 설정" style="position: absolute; left: 30px; top: 20px; width: 900px; height: 600px; border-radius: 26px; overflow: hidden; display: flex; background: #F6F5FB; box-shadow: 0 0 0 1px #E2E0EC, 0 28px 70px rgba(76,60,160,.22)">

    <nav aria-label="설정 묶음" style="width: 206px; flex: none; box-sizing: border-box; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px">
        <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#EAE2FF"/><rect x="2" y="2" width="60" height="30" rx="16" fill="#FFFFFF" opacity=".45"/><rect x="17" y="17" width="30" height="30" rx="11" fill="#7C5CFF"/><path d="M25 36c3-5 6 1 9-3s4-2 5-1" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/></svg>
        <div><p style="margin: 0; font-size: 14px; font-weight: 700; color: #24223A">screen-ink</p><p style="margin: 0; font-size: 11px; color: #6B6789">0.1 · 1차</p></div>
      </div>
      <button type="button" class="nav on" aria-current="page"><span class="c"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M7 14h10M6 10h.01M10 10h.01M14 10h.01M18 10h.01"/></svg></span>단축키</button>
      <button type="button" class="nav"><span class="c"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg></span>캡처·녹화</button>
      <button type="button" class="nav"><span class="c"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>판서·확대</button>
      <button type="button" class="nav"><span class="c"><svg viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></span>일반</button>
      <div style="flex: 1"></div>
      <button type="button" class="nav"><span class="c"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>정보</button>
    </nav>

    <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 24px 30px 24px 12px; display: flex; flex-direction: column; gap: 14px; position: relative">
      <button type="button" aria-label="닫기" style="position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 15px; border: 0; background: #EEECF6; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="#6B6789" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <div style="display: flex; align-items: center; gap: 14px; padding-right: 44px">
        <h1 style="margin: 0; font-size: 21px; font-weight: 700; color: #24223A; flex: 1">단축키</h1>
        <div role="tablist" aria-label="단축키 범위" style="display: flex; padding: 4px; border-radius: 16px; background: #EEECF6">
          <button type="button" role="tab" aria-selected="true" style="border: 0; font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 5px 14px; border-radius: 12px; background: #FFFFFF; color: #24223A; box-shadow: 0 2px 6px rgba(76,60,160,.14)">어디서나 16</button>
          <button type="button" role="tab" aria-selected="false" style="border: 0; font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 5px 14px; border-radius: 12px; background: none; color: #3D3A57">화면 안 43</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 18px; background: #FFF1EB">
        <span class="dot" style="margin: 0"></span>
        <p style="margin: 0; flex: 1; font-size: 13px; font-weight: 500; color: #24223A; white-space: nowrap">Snipaste가 F1 키 4개를 먼저 쓰고 있어요</p>
        <button type="button" style="border: 0; font-family: inherit; font-size: 12.5px; font-weight: 700; height: 30px; padding: 0 14px; border-radius: 15px; background: #FFFFFF; color: #B4501F">Snipaste 끄는 법</button>
      </div>

      <section>
        <p class="gh">캡처</p>
        <div class="grp">
          <div class="r"><span class="l">범위 캡처</span><span class="dot"></span><span class="k"><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">창 캡처</span><span class="k"><kbd>F2</kbd></span></div>
          <div class="r"><span class="l">화면 녹화</span><span class="k"><kbd>F3</kbd></span></div>
          <div class="r"><span class="l">직전 범위 바로 캡처</span><span class="dot"></span><span class="k"><kbd>Shift</kbd><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">모니터 전체 바로 캡처</span><span class="dot"></span><span class="k"><kbd>Ctrl</kbd><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">활성 창 바로 캡처</span><span class="k"><kbd>Shift</kbd><kbd>F2</kbd></span></div>
          <div class="r"><span class="l">지연 캡처</span><span class="k"><kbd>Alt</kbd><kbd>F1</kbd></span></div>
        </div>
      </section>

      <section>
        <p class="gh">화면 도구</p>
        <div class="grp">
          <div class="r"><span class="l">판서</span><span class="k"><kbd>Alt</kbd><kbd>1</kbd></span></div>
          <div class="r"><span class="l">실시간 확대</span><span class="k"><kbd>Alt</kbd><kbd>2</kbd></span></div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
