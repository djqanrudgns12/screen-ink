<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C 문구점 — 요소 시트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
.sh{margin:0 0 10px;font-family:'Gowun Dodum',sans-serif;font-size:13px;color:#6F6B64}
.card{background:#FFFFFF;border-radius:12px;box-shadow:0 0 0 1px #E9E4DA;padding:14px}
.tok{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tok div{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#1F1E1C;white-space:nowrap}
.tok i{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tok small{color:#6F6B64;font-size:10.5px}
.pc{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px #FFFFFF,0 0 0 3px #E3DDD0;display:grid;place-items:center;font-size:10px;font-weight:700;color:#FFFFFF}
</style>
</helmet>
<div style="width: 720px; height: 640px; box-sizing: border-box; padding: 28px 32px; background: #FAF8F4; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1F1E1C; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 24px; align-content: start">

  <section>
    <p class="sh">앱 아이콘</p>
    <div class="card" style="display: flex; align-items: flex-end; gap: 16px">
      <svg width="84" height="84" viewBox="0 0 64 64" role="img" aria-label="앱 아이콘"><rect width="64" height="64" rx="15" fill="#FFFDF8"/><rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#E2D9C6"/><path d="M16 44h32" stroke="#F2B705" stroke-width="6" stroke-linecap="round" opacity=".55"/><path d="M19 40l20-20 5 5-20 20-6 1z" fill="#E5484D"/><path d="M39 20l5 5" stroke="#2A2925" stroke-width="2"/><path d="M19 40l-1 6 6-1" fill="#2A2925"/></svg>
      <svg width="42" height="42" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#FFFDF8"/><rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#E2D9C6"/><path d="M16 44h32" stroke="#F2B705" stroke-width="6" stroke-linecap="round" opacity=".55"/><path d="M19 40l20-20 5 5-20 20-6 1z" fill="#E5484D"/><path d="M19 40l-1 6 6-1" fill="#2A2925"/></svg>
    </div>
  </section>

  <section>
    <p class="sh">트레이 아이콘 — 기본 · 녹화 중 · 꺼짐</p>
    <div style="display: flex; height: 112px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px #E9E4DA">
      <div style="flex: 1; display: flex; align-items: center; justify-content: space-evenly; background: #FFFFFF">
        <svg width="20" height="20" viewBox="0 0 18 18" role="img" aria-label="기본"><path d="M3.5 13.5l7.5-7.5 2 2-7.5 7.5-2.5.5z" fill="none" stroke="#1F1E1C" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 16.5h12" stroke="#1F1E1C" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg width="20" height="20" viewBox="0 0 18 18" role="img" aria-label="녹화 중"><path d="M3.5 13.5l7.5-7.5 2 2-7.5 7.5-2.5.5z" fill="none" stroke="#1F1E1C" stroke-width="1.6" stroke-linejoin="round"/><circle cx="14" cy="4" r="3" fill="#E5484D"/></svg>
        <svg width="20" height="20" viewBox="0 0 18 18" role="img" aria-label="꺼짐"><path d="M3.5 13.5l7.5-7.5 2 2-7.5 7.5-2.5.5z" fill="none" stroke="#1F1E1C" stroke-opacity=".35" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <div style="flex: 1; display: flex; align-items: center; justify-content: space-evenly; background: #1E1D1B">
        <svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 13.5l7.5-7.5 2 2-7.5 7.5-2.5.5z" fill="none" stroke="#F4F1EA" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 16.5h12" stroke="#F4F1EA" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 13.5l7.5-7.5 2 2-7.5 7.5-2.5.5z" fill="none" stroke="#F4F1EA" stroke-width="1.6" stroke-linejoin="round"/><circle cx="14" cy="4" r="3" fill="#F87171"/></svg>
        <svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 13.5l7.5-7.5 2 2-7.5 7.5-2.5.5z" fill="none" stroke="#F4F1EA" stroke-opacity=".4" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </section>

  <section style="grid-column: 1 / -1">
    <p class="sh">색 — 종이 바탕, 강조는 잉크 주황 하나</p>
    <div class="card tok">
      <div><i style="background: #FAF8F4"></i>바탕 <small>#FAF8F4</small></div>
      <div><i style="background: #FFFFFF"></i>면 <small>#FFFFFF</small></div>
      <div><i style="background: #1F1E1C"></i>글자 <small>#1F1E1C</small></div>
      <div><i style="background: #6F6B64"></i>보조 글자 <small>#6F6B64</small></div>
      <div><i style="background: #E9E4DA"></i>구분선 <small>#E9E4DA</small></div>
      <div><i style="background: #D97706"></i>강조 <small>#D97706</small></div>
    </div>
  </section>

  <section>
    <p class="sh">판서 — 필통 줄(펜 색 6 · 굵기 · 배율)</p>
    <div class="card" style="display: flex; align-items: center; gap: 12px">
      <span class="pc" style="background: #E5484D; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #1F1E1C">R</span>
      <span class="pc" style="background: #F2B705; color: #1F1E1C">Y</span>
      <span class="pc" style="background: #2BA36B">G</span>
      <span class="pc" style="background: #F97316">O</span>
      <span class="pc" style="background: #2F6FED">B</span>
      <span class="pc" style="background: #84CC16; color: #1F1E1C">L</span>
      <span style="flex: 1"></span>
      <span style="font-size: 12px; color: #3F3B35; white-space: nowrap; font-variant-numeric: tabular-nums">4px · ×1.75</span>
    </div>
  </section>

  <section>
    <p class="sh">말풍선 — 결과 · 문제</p>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div role="status" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 6px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 1px #E9E4DA, 0 6px 16px rgba(60,45,20,.12)">
        <span style="width: 40px; height: 30px; border-radius: 6px; background: #F1ECE3"></span>
        <span style="flex: 1; font-size: 13px; white-space: nowrap">복사했어요 · 718×40</span>
        <button type="button" style="height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid #E3DDD0; background: #FFFFFF; font-family: inherit; font-size: 12.5px; color: #1F1E1C">저장</button>
      </div>
      <div role="status" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 6px 0 14px; border-radius: 10px; background: #FFF6DA">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #D97706"></span>
        <span style="flex: 1; font-size: 13px; white-space: nowrap">F1은 Snipaste가 쓰고 있어요</span>
        <button type="button" style="height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid #E3DDD0; background: #FFFFFF; font-family: inherit; font-size: 12.5px; color: #1F1E1C">해결</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
