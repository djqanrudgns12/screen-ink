<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A 클리어 — 트레이 팝오버</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.hd{margin:6px 10px 2px;font-size:11px;font-weight:500;color:#86868B;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:7px;font-size:13.5px;color:#1D1D1F;border:0;background:none;width:100%;box-sizing:border-box;font-family:inherit;text-align:left}
.row .lbl{flex:1;white-space:nowrap}
.row .kb{font-size:12px;color:#86868B;font-variant-numeric:tabular-nums}
.row svg{width:16px;height:16px;flex:none;fill:none;stroke:#48484A;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row.on{background:#0A7CFF;color:#FFFFFF}.row.on .kb{color:rgba(255,255,255,.82)}.row.on svg{stroke:#FFFFFF}
.sep{height:1px;background:rgba(0,0,0,.08);margin:5px 10px}
</style>
</helmet>
<div style="width: 720px; height: 560px; position: relative; overflow: hidden; background: #DDE2E8; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: rgba(245,246,248,.86); border-top: 1px solid rgba(0,0,0,.06); display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 16px">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #A1A7B0"></span>
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #A1A7B0"></span>
    <span style="width: 30px; height: 30px; border-radius: 8px; background: rgba(0,0,0,.07); display: grid; place-items: center">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 6V4a1.5 1.5 0 0 1 1.5-1.5h2M12 2.5h2A1.5 1.5 0 0 1 15.5 4v2M15.5 12v2a1.5 1.5 0 0 1-1.5 1.5h-2M6 15.5H4A1.5 1.5 0 0 1 2.5 14v-2" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="9" r="2.2" fill="#1D1D1F"/></svg>
    </span>
    <span style="font-size: 12.5px; color: #1D1D1F; font-variant-numeric: tabular-nums">10:31</span>
  </div>

  <div role="menu" aria-label="screen-ink 메뉴" style="position: absolute; right: 14px; bottom: 54px; width: 288px; box-sizing: border-box; padding: 6px; border-radius: 14px; background: rgba(248,248,250,.9); box-shadow: 0 0 0 0.5px rgba(0,0,0,.12), 0 18px 50px rgba(17,24,39,.22)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#FFFFFF"/><rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#000" stroke-opacity=".1"/><path d="M18 24v-4a2 2 0 0 1 2-2h4M40 18h4a2 2 0 0 1 2 2v4M46 40v4a2 2 0 0 1-2 2h-4M24 46h-4a2 2 0 0 1-2-2v-4" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round"/><path d="M22 38c5-9 9 3 14-5s7-3 8-1" fill="none" stroke="#0A7CFF" stroke-width="4" stroke-linecap="round"/></svg>
      <p style="margin: 0; flex: 1; font-size: 14px; font-weight: 700; color: #1D1D1F">screen-ink</p>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #6E6E73"><span style="width: 6px; height: 6px; border-radius: 50%; background: #34C759"></span>준비됨</span>
    </div>
    <div class="sep" style="margin-top: 0"></div>

    <p class="hd">캡처·녹화</p>
    <button type="button" class="row on"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg><span class="lbl">범위 캡처</span><span class="kb">F1</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg><span class="lbl">창 캡처</span><span class="kb">F2</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="#48484A" stroke="none"/></svg><span class="lbl">화면 녹화</span><span class="kb">F3</span></button>

    <p class="hd">화면 도구</p>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="lbl">판서</span><span class="kb">Alt+1</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg><span class="lbl">실시간 확대</span><span class="kb">Alt+2</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg><span class="lbl">칠판</span><span class="kb">Alt+3</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3H7l3-3z"/><path d="M12 12v8"/></svg><span class="lbl">창 항상 위</span><span class="kb">Alt+Shift+D</span></button>

    <p class="hd">빠른 동작</p>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span class="lbl">직전 판서 열기</span><span class="kb">Alt+Shift+1</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">저장 폴더 열기</span></button>

    <div class="sep"></div>
    <div style="display: flex; align-items: center; height: 32px; padding: 0 10px; font-size: 13.5px; color: #1D1D1F">
      <span style="flex: 1; white-space: nowrap">단축키 켜기</span>
      <button type="button" role="switch" aria-checked="true" aria-label="단축키 켜기" style="width: 34px; height: 20px; border-radius: 10px; border: 0; background: #34C759; position: relative; padding: 0"><span style="position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.25)"></span></button>
    </div>
    <div style="display: flex; gap: 2px">
      <button type="button" class="row" style="flex: 1"><span class="lbl">설정…</span></button>
      <button type="button" class="row" style="flex: 1; justify-content: flex-end"><span class="lbl" style="flex: none; color: #6E6E73">끝내기</span></button>
    </div>
  </div>
</div>
</x-dc>
