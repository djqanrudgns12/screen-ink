<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>D 젤리 — 트레이 팝오버</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.tl{display:flex;flex-direction:column;align-items:flex-start;gap:7px;height:84px;padding:10px;border-radius:16px;border:0;font-family:inherit;text-align:left;box-sizing:border-box;background:#FFFFFF;box-shadow:inset 0 0 0 1px #ECEAF5;color:#24223A;position:relative}
.tl .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.tl .ic svg{width:17px;height:17px;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tl .n{font-size:12.5px;font-weight:700;white-space:nowrap}
.tl .k{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:500;color:#6B6789}
.tl.on{box-shadow:inset 0 0 0 2px #7C5CFF,0 8px 18px rgba(124,92,255,.18)}
.hd{margin:12px 8px 4px;font-size:11.5px;font-weight:500;color:#6B6789}
.row{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:10px;font-size:13.5px;color:#24223A;border:0;background:none;width:100%;font-family:inherit;text-align:left;box-sizing:border-box}
.row svg{width:16px;height:16px;flex:none;fill:none;stroke:#6B6789;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .l{flex:1;white-space:nowrap}
.row .k{font-size:11.5px;color:#6B6789;background:#F3F2F9;border-radius:6px;padding:1px 7px}
.pill{height:32px;padding:0 14px;border-radius:16px;border:0;font-family:inherit;font-size:12.5px;font-weight:500}
</style>
</helmet>
<div style="width: 720px; height: 560px; position: relative; overflow: hidden; background: #E4E2EE; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: rgba(246,245,251,.92); border-top: 1px solid #E2E0EC; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 16px">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #ABA7BE"></span>
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #ABA7BE"></span>
    <span style="width: 30px; height: 30px; border-radius: 10px; background: #EAE2FF; display: grid; place-items: center">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="4.5" fill="#7C5CFF"/><path d="M6 10.5c1-1.6 2 .4 3-1s1.5-.6 2-.3" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/></svg>
    </span>
    <span style="font-size: 12.5px; color: #24223A; font-variant-numeric: tabular-nums">10:31</span>
  </div>

  <div role="menu" aria-label="screen-ink 메뉴" style="position: absolute; right: 14px; bottom: 56px; width: 304px; box-sizing: border-box; padding: 12px; border-radius: 24px; background: #FBFAFE; box-shadow: 0 0 0 1px #ECEAF5, 0 22px 50px rgba(76,60,160,.2)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 2px 4px 12px">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#EAE2FF"/><rect x="2" y="2" width="60" height="30" rx="16" fill="#FFFFFF" opacity=".45"/><rect x="17" y="17" width="30" height="30" rx="11" fill="#7C5CFF"/><path d="M25 36c3-5 6 1 9-3s4-2 5-1" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/></svg>
      <p style="margin: 0; flex: 1; font-size: 14.5px; font-weight: 700; color: #24223A">screen-ink</p>
      <span style="display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 11px; background: #E3F6EE; font-size: 11.5px; font-weight: 500; color: #116B4C"><span style="width: 6px; height: 6px; border-radius: 50%; background: #16A37A"></span>준비됨</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" class="tl on"><span class="ic" style="background: #FFF1EB"><svg viewBox="0 0 24 24" style="stroke: #E86A33"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg></span><span class="n">범위 캡처</span><span class="k">F1</span></button>
      <button type="button" class="tl"><span class="ic" style="background: #EAF2FF"><svg viewBox="0 0 24 24" style="stroke: #3B7BE8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></svg></span><span class="n">창 캡처</span><span class="k">F2</span></button>
      <button type="button" class="tl"><span class="ic" style="background: #FEF0F0"><svg viewBox="0 0 24 24" style="stroke: #E5484D"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="#E5484D" stroke="none"/></svg></span><span class="n">화면 녹화</span><span class="k">F3</span></button>
      <button type="button" class="tl"><span class="ic" style="background: #F1EDFF"><svg viewBox="0 0 24 24" style="stroke: #7C5CFF"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span><span class="n">판서</span><span class="k">Alt+1</span></button>
      <button type="button" class="tl"><span class="ic" style="background: #EAF8F3"><svg viewBox="0 0 24 24" style="stroke: #16A37A"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></span><span class="n">실시간 확대</span><span class="k">Alt+2</span></button>
      <button type="button" class="tl"><span class="ic" style="background: #FFF8E5"><svg viewBox="0 0 24 24" style="stroke: #B07A00"><rect x="3" y="4" width="18" height="12" rx="3"/><path d="M12 16v4M8 20h8"/></svg></span><span class="n">칠판</span><span class="k">Alt+3</span></button>
    </div>

    <p class="hd">빠른 동작</p>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3H7l3-3z"/><path d="M12 12v8"/></svg><span class="l">창 항상 위</span><span class="k">Alt+Shift+D</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span class="l">직전 판서 열기</span><span class="k">Alt+Shift+1</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="l">저장 폴더 열기</span></button>

    <div style="display: flex; align-items: center; gap: 6px; margin-top: 10px">
      <button type="button" role="switch" aria-checked="true" class="pill" style="flex: 1; display: flex; align-items: center; gap: 8px; background: #F1EDFF; color: #4C3BB8"><span style="width: 26px; height: 16px; border-radius: 8px; background: #7C5CFF; position: relative"><span style="position: absolute; top: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span></span>단축키 켜짐</button>
      <button type="button" class="pill" style="background: #F3F2F9; color: #24223A">설정</button>
      <button type="button" class="pill" style="background: none; color: #6B6789">끝내기</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":560}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
