<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>E 그래파이트 — 설정 단축키</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:6px;font-size:13px;color:#3A3A38;border:0;background:none;width:100%;font-family:inherit;text-align:left}
.nav svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav.on{background:#1A1A1A;color:#FAFAF8}
.gh{margin:0 0 6px 2px;font-size:10.5px;font-weight:500;letter-spacing:.06em;color:#6B6B68}
.grp{background:#FFFFFF;border-radius:8px;box-shadow:0 0 0 1px #DDDDD8}
.r{display:flex;align-items:center;height:33px;padding:0 12px;font-size:13px;color:#121212;border-top:1px solid #EDEDEA}
.r:first-child{border-top:0}
.r .l{flex:1;white-space:nowrap}
.k{display:flex;gap:3px}
.k kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#3A3A38;background:#EFEFEC;border:1px solid #DDDDD8;border-radius:4px;padding:0 6px;line-height:19px;min-width:12px;text-align:center}
.dot{width:6px;height:6px;border-radius:50%;background:#FF9F0A;margin-right:10px}
</style>
</helmet>
<div style="width: 960px; height: 640px; position: relative; background: #D9D9D5; font-family: 'IBM Plex Sans KR', system-ui, sans-serif">
  <div role="dialog" aria-label="screen-ink 설정" style="position: absolute; left: 30px; top: 20px; width: 900px; height: 600px; border-radius: 12px; overflow: hidden; display: flex; background: #F4F4F1; box-shadow: 0 0 0 1px #CFCFC9, 0 20px 50px rgba(0,0,0,.2)">

    <nav aria-label="설정 묶음" style="width: 196px; flex: none; box-sizing: border-box; padding: 16px 10px; background: #EAEAE6; border-right: 1px solid #DDDDD8; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px">
        <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#1A1A1A"/><path d="M18 26v-6a2 2 0 0 1 2-2h6M38 18h6a2 2 0 0 1 2 2v6M46 38v6a2 2 0 0 1-2 2h-6M26 46h-6a2 2 0 0 1-2-2v-6" fill="none" stroke="#FAFAF8" stroke-width="2.5" stroke-linecap="round"/><circle cx="32" cy="32" r="5" fill="#FF9F0A"/></svg>
        <div><p style="margin: 0; font-size: 13px; font-weight: 600; color: #121212">screen-ink</p><p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6B6B68">0.1.0</p></div>
      </div>
      <button type="button" class="nav on" aria-current="page"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M7 14h10M6 10h.01M10 10h.01M14 10h.01M18 10h.01"/></svg>단축키</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>캡처·녹화</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>판서·확대</button>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>일반</button>
      <div style="flex: 1"></div>
      <button type="button" class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>정보</button>
    </nav>

    <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 18px 26px; display: flex; flex-direction: column; gap: 12px; position: relative">
      <button type="button" aria-label="닫기" style="position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 6px; border: 0; background: none; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="#3A3A38" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <div style="display: flex; align-items: center; gap: 14px; padding-right: 34px">
        <h1 style="margin: 0; font-size: 19px; font-weight: 600; color: #121212; flex: 1">단축키</h1>
        <div role="tablist" aria-label="단축키 범위" style="display: flex; border-radius: 6px; box-shadow: 0 0 0 1px #CFCFC9; overflow: hidden">
          <button type="button" role="tab" aria-selected="true" style="border: 0; font-family: inherit; font-size: 12px; font-weight: 500; padding: 4px 12px; background: #1A1A1A; color: #FAFAF8">어디서나 <span style="font-family: 'IBM Plex Mono', monospace; color: #FF9F0A">16</span></button>
          <button type="button" role="tab" aria-selected="false" style="border: 0; font-family: inherit; font-size: 12px; padding: 4px 12px; background: #FFFFFF; color: #3A3A38">화면 안 <span style="font-family: 'IBM Plex Mono', monospace">43</span></button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 12px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 0 0 1px #DDDDD8">
        <span class="dot" style="margin: 0"></span>
        <p style="margin: 0; flex: 1; font-size: 12.5px; color: #121212; white-space: nowrap">Snipaste가 F1 키 4개를 먼저 쓰고 있어요</p>
        <button type="button" style="border: 0; font-family: inherit; font-size: 12px; font-weight: 500; height: 26px; padding: 0 10px; border-radius: 5px; background: #1A1A1A; color: #FAFAF8">Snipaste 끄는 법</button>
      </div>

      <section>
        <p class="gh">캡처</p>
        <div class="grp">
          <div class="r"><span class="l">범위 캡처</span><span class="dot"></span><span class="k"><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">창 캡처</span><span class="k"><kbd>F2</kbd></span></div>
          <div class="r"><span class="l">화면 녹화</span><span class="k"><kbd>F3</kbd></span></div>
          <div class="r"><span class="l">직전 범위 바로 캡처</span><span class="dot"></span><span class="k"><kbd>Shift</kbd><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">모니터 전체 바로 캡처</span><span class="dot"></span><span class="k"><kbd>Ctrl</kbd><kbd>F1</kbd></span></div>
          <div class="r"><span class="l">활성 창 바로 캡처</span><span class="k"><kbd>Shift</kbd><kbd>F2</kbd></span></div>
          <div class="r"><span class="l">지연 캡처</span><span class="k"><kbd>Alt</kbd><kbd>F1</kbd></span></div>
        </div>
      </section>

      <section>
        <p class="gh">화면 도구</p>
        <div class="grp">
          <div class="r"><span class="l">판서</span><span class="k"><kbd>Alt</kbd><kbd>1</kbd></span></div>
          <div class="r"><span class="l">실시간 확대</span><span class="k"><kbd>Alt</kbd><kbd>2</kbd></span></div>
          <div class="r"><span class="l">칠판</span><span class="k"><kbd>Alt</kbd><kbd>3</kbd></span></div>
          <div class="r"><span class="l">창 항상 위</span><span class="k"><kbd>Alt</kbd><kbd>Shift</kbd><kbd>D</kbd></span></div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
