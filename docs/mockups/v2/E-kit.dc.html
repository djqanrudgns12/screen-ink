<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>E 그래파이트 — 요소 시트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.sh{margin:0 0 8px;font-size:10.5px;font-weight:500;letter-spacing:.06em;color:#6B6B68}
.card{background:#FFFFFF;border-radius:8px;box-shadow:0 0 0 1px #DDDDD8;padding:14px}
.tok{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tok div{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#121212;white-space:nowrap}
.tok i{width:22px;height:22px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.tok small{font-family:'IBM Plex Mono',monospace;color:#6B6B68;font-size:10.5px}
.bar{display:flex;align-items:center;gap:10px;height:36px;padding:0 6px 0 12px;border-radius:7px;background:#1A1A1A;color:#FAFAF8;font-size:12.5px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.bar small{font-family:'IBM Plex Mono',monospace;color:#A3A39E;font-size:11px}
.bar button{height:26px;padding:0 10px;border-radius:5px;border:0;background:#2A2A2A;color:#FAFAF8;font-family:inherit;font-size:12px}
kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#3A3A38;background:#EFEFEC;border:1px solid #DDDDD8;border-radius:4px;padding:0 6px;line-height:19px}
</style>
</helmet>
<div style="width: 720px; height: 640px; box-sizing: border-box; padding: 28px 32px; background: #EFEFEC; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #121212; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 24px; align-content: start">

  <section>
    <p class="sh">앱 아이콘</p>
    <div class="card" style="display: flex; align-items: flex-end; gap: 16px">
      <svg width="84" height="84" viewBox="0 0 64 64" role="img" aria-label="앱 아이콘"><rect width="64" height="64" rx="15" fill="#1A1A1A"/><path d="M18 26v-6a2 2 0 0 1 2-2h6M38 18h6a2 2 0 0 1 2 2v6M46 38v6a2 2 0 0 1-2 2h-6M26 46h-6a2 2 0 0 1-2-2v-6" fill="none" stroke="#FAFAF8" stroke-width="2.5" stroke-linecap="round"/><circle cx="32" cy="32" r="5" fill="#FF9F0A"/></svg>
      <svg width="42" height="42" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#1A1A1A"/><path d="M18 26v-6a2 2 0 0 1 2-2h6M38 18h6a2 2 0 0 1 2 2v6M46 38v6a2 2 0 0 1-2 2h-6M26 46h-6a2 2 0 0 1-2-2v-6" fill="none" stroke="#FAFAF8" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="32" r="6" fill="#FF9F0A"/></svg>
    </div>
  </section>

  <section>
    <p class="sh">트레이 아이콘 — 기본 · 녹화 중 · 꺼짐</p>
    <div style="display: flex; height: 112px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px #DDDDD8">
      <div style="flex: 1; display: flex; align-items: center; justify-content: space-evenly; background: #FFFFFF">
        <svg width="20" height="20" viewBox="0 0 18 18" role="img" aria-label="기본"><path d="M2.5 6V4a1.5 1.5 0 0 1 1.5-1.5h2M12 2.5h2A1.5 1.5 0 0 1 15.5 4v2M15.5 12v2a1.5 1.5 0 0 1-1.5 1.5h-2M6 15.5H4A1.5 1.5 0 0 1 2.5 14v-2" fill="none" stroke="#121212" stroke-width="1.4" stroke-linecap="round"/><circle cx="9" cy="9" r="2" fill="#121212"/></svg>
        <svg width="20" height="20" viewBox="0 0 18 18" role="img" aria-label="녹화 중"><path d="M2.5 6V4a1.5 1.5 0 0 1 1.5-1.5h2M12 2.5h2A1.5 1.5 0 0 1 15.5 4v2M15.5 12v2a1.5 1.5 0 0 1-1.5 1.5h-2M6 15.5H4A1.5 1.5 0 0 1 2.5 14v-2" fill="none" stroke="#121212" stroke-width="1.4" stroke-linecap="round"/><circle cx="9" cy="9" r="3" fill="#E5484D"/></svg>
        <svg width="20" height="20" viewBox="0 0 18 18" role="img" aria-label="꺼짐"><path d="M2.5 6V4a1.5 1.5 0 0 1 1.5-1.5h2M12 2.5h2A1.5 1.5 0 0 1 15.5 4v2M15.5 12v2a1.5 1.5 0 0 1-1.5 1.5h-2M6 15.5H4A1.5 1.5 0 0 1 2.5 14v-2" fill="none" stroke="#121212" stroke-opacity=".35" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
      <div style="flex: 1; display: flex; align-items: center; justify-content: space-evenly; background: #1A1A1A">
        <svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 6V4a1.5 1.5 0 0 1 1.5-1.5h2M12 2.5h2A1.5 1.5 0 0 1 15.5 4v2M15.5 12v2a1.5 1.5 0 0 1-1.5 1.5h-2M6 15.5H4A1.5 1.5 0 0 1 2.5 14v-2" fill="none" stroke="#FAFAF8" stroke-width="1.4" stroke-linecap="round"/><circle cx="9" cy="9" r="2" fill="#FF9F0A"/></svg>
        <svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 6V4a1.5 1.5 0 0 1 1.5-1.5h2M12 2.5h2A1.5 1.5 0 0 1 15.5 4v2M15.5 12v2a1.5 1.5 0 0 1-1.5 1.5h-2M6 15.5H4A1.5 1.5 0 0 1 2.5 14v-2" fill="none" stroke="#FAFAF8" stroke-width="1.4" stroke-linecap="round"/><circle cx="9" cy="9" r="3" fill="#FF6369"/></svg>
        <svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 6V4a1.5 1.5 0 0 1 1.5-1.5h2M12 2.5h2A1.5 1.5 0 0 1 15.5 4v2M15.5 12v2a1.5 1.5 0 0 1-1.5 1.5h-2M6 15.5H4A1.5 1.5 0 0 1 2.5 14v-2" fill="none" stroke="#FAFAF8" stroke-opacity=".4" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
    </div>
  </section>

  <section style="grid-column: 1 / -1">
    <p class="sh">색 — 무채색 + 주황 한 점</p>
    <div class="card tok">
      <div><i style="background: #EFEFEC"></i>바탕 <small>#EFEFEC</small></div>
      <div><i style="background: #FFFFFF"></i>면 <small>#FFFFFF</small></div>
      <div><i style="background: #1A1A1A"></i>짙은 면·글자 <small>#1A1A1A</small></div>
      <div><i style="background: #6B6B68"></i>보조 글자 <small>#6B6B68</small></div>
      <div><i style="background: #DDDDD8"></i>구분선 <small>#DDDDD8</small></div>
      <div><i style="background: #FF9F0A"></i>강조 <small>#FF9F0A</small></div>
    </div>
  </section>

  <section style="grid-column: 1 / -1">
    <p class="sh">말풍선 · 판서 상태 · 키</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px">
      <div role="status" class="bar"><span style="width: 32px; height: 22px; border-radius: 3px; background: #3A3A3A"></span><span style="flex: 1">복사했어요</span><small>718×40</small><button type="button">저장</button></div>
      <div role="status" class="bar"><span style="width: 6px; height: 6px; border-radius: 50%; background: #FF9F0A"></span><span style="flex: 1">F1은 Snipaste가 사용 중</span><button type="button">해결</button></div>
      <div class="bar" style="padding-right: 12px"><span style="width: 12px; height: 12px; border-radius: 2px; background: #E5484D"></span><span>펜</span><small>4px</small><small>×1.75</small><span style="flex: 1"></span><small>? 단축키</small></div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #3A3A38"><kbd>Alt</kbd><kbd>Shift</kbd><kbd>D</kbd><span style="margin-left: 8px">키는 고정폭 글꼴로 정렬</span></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
