</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
.hd{margin:10px 10px 3px;font-family:'Gowun Dodum',sans-serif;font-size:12px;color:#6F6B64}
.row{display:flex;align-items:center;gap:10px;height:31px;padding:0 10px;font-size:13.5px;color:#1F1E1C;border:0;background:none;width:100%;box-sizing:border-box;font-family:inherit;text-align:left}
.row svg{width:16px;height:16px;flex:none;fill:none;stroke:#3F3B35;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .l{flex:1;white-space:nowrap}
.row .l b{font-weight:400;padding:0 3px;margin:0 -3px;border-radius:4px;background:linear-gradient(transparent 52%, rgba(253,224,71,.75) 52%, rgba(253,224,71,.75) 92%, transparent 92%)}
.tag{font-size:11.5px;color:#4A463F;background:#FFFFFF;border:1px solid #E3DDD0;border-radius:5px;padding:0 6px;line-height:18px}
.rule{height:1px;background:#EEE9DF;margin:6px 10px}
</style>
</helmet>
<div style="width: 720px; height: 560px; position: relative; overflow: hidden; background: #E7E2D8; font-family: 'Noto Sans KR', system-ui, sans-serif">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: rgba(250,248,244,.94); border-top: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 16px">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #B8B0A2"></span>

    </span>
    <span style="font-size: 12.5px; color: #1F1E1C; font-variant-numeric: tabular-nums">10:31</span>
  </div>

    <div class="rule" style="margin-top: 0"></div>

    <button type="button" class="row"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="#E5484D" stroke="none"/></svg><span class="l">화면 녹화</span><span class="tag">F3</span></button>

    <p class="hd">화면 도구</p>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="l">판서</span><span class="tag">Alt+1</span></button>

    <button type="button" class="row"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg><span class="l">칠판</span><span class="tag">Alt+3</span></button>

    <p class="hd">빠른 동작</p>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span class="l">직전 판서 열기</span><span class="tag">Alt+Shift+1</span></button>
    <button type="button" class="row"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="l">저장 폴더 열기</span></button>

    <div class="rule"></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 2px 10px 0">
      <span style="flex: 1; font-size: 13px; color: #1F1E1C; white-space: nowrap">단축키 켜기</span>
      <button type="button" role="switch" aria-checked="true" aria-label="단축키 켜기" style="width: 34px; height: 20px; border-radius: 10px; border: 0; background: #D97706; position: relative; padding: 0"><span style="position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span></button>
    </div>
    <div style="display: flex; padding: 6px 10px 0; gap: 16px; font-size: 13px">
      <button type="button" style="border: 0; background: none; padding: 4px 0; font-family: inherit; font-size: 13px; color: #1F1E1C">설정…</button>
      <span style="flex: 1"></span>
      <button type="button" style="border: 0; background: none; padding: 4px 0; font-family: inherit; font-size: 13px; color: #6F6B64">끝내기</button>
    </div>
  </div>
</div>
