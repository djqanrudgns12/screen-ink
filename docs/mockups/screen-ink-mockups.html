<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>screen-ink 화면 시안 (PRD v0.3)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ─────────────────────────────────────────────────────────────
   screen-ink 화면 시안 — Tidy-Task-Local 디자인 체계(--st-* 토큰, 설정 카드, 스위치 줄,
   점무늬 알림 말씨)를 따른다. 경쟁 앱(Snipaste·아이캔 줌잇)의 화면 모양은 쓰지 않는다.
   조작: 상단 막대에서 화면을 고르고, 각 화면 아래 안내대로 마우스·키보드를 써 본다.
   이미지 내보내기: ?shot=1#s07 처럼 열면 막대 없이 1440×900 고정 장면이 그려진다.
   ───────────────────────────────────────────────────────────── */
:root{
  --accent:#d97706; --bg:#fdfaf3; --section:#f4ebce; --border:#e8ddb7;
  --ink:#1f2937; --sub:#4b5563; --muted:#6b7280;
  --edge:rgba(15,23,42,.12); --line:rgba(15,23,42,.09); --line-soft:rgba(15,23,42,.07);
  --panel:rgba(255,255,255,.72); --field:#fff; --card:#fff;
  --piece:rgba(15,23,42,.025); --piece-hover:rgba(15,23,42,.055);
  --chrome:rgba(15,23,42,.035); --hover:rgba(15,23,42,.06); --track:rgba(15,23,42,.2);
  --on-accent:#fff;
  --accent-fill:color-mix(in srgb,var(--accent) 84%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --accent-line:color-mix(in srgb,var(--accent) 42%,transparent);
  --good:#047857; --danger:#b9322a; --danger-soft:rgba(185,50,42,.09); --danger-line:rgba(185,50,42,.4);
  --tone-peach:#ea580c; --tone-gold:#ca8a04; --tone-mint:#059669; --tone-sky:#0284c7; --tone-lilac:#7c3aed; --tone-rose:#e11d48;
  --spring:cubic-bezier(.34,1.56,.64,1);
  font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  color:var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e5dc}
body.shot{overflow:hidden;background:#fff}
button{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:50;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#fffdf8;border-bottom:1px solid var(--border)}
.topbar b{font-size:13px;margin-right:6px}
.topbar a{font-size:12px;text-decoration:none;color:var(--sub);padding:4px 9px;border-radius:99px;background:var(--piece);border:1px solid var(--line)}
.topbar a.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);font-weight:700}
.howto{width:1440px;margin:8px auto 0;font-size:12.5px;color:var(--sub);background:#fffdf8;border:1px dashed var(--accent-line);border-radius:12px;padding:8px 12px}
.howto kbd,.kbd{display:inline-block;min-width:18px;padding:0 5px;border-radius:6px;border:1px solid var(--line);border-bottom-width:2px;background:#fff;font:700 11px/18px 'Malgun Gothic',sans-serif;color:var(--ink);text-align:center}
#stage{width:1440px;height:900px;margin:8px auto 40px;position:relative}
body.shot #stage{margin:0}
body.shot .topbar,body.shot .howto{display:none}

/* ── 가짜 바탕 화면 ── */
.desk{position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,#dfe8ee 0%,#efe9dc 55%,#e7dfd1 100%);user-select:none}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(248,248,246,.94);border-top:1px solid rgba(0,0,0,.06);display:flex;align-items:center;padding:0 14px;gap:10px;font-size:12px;color:#374151}
.taskbar .apps{display:flex;gap:8px;margin:0 auto}
.taskbar .apps i{width:30px;height:30px;border-radius:8px;background:rgba(15,23,42,.07)}
.taskbar .tray{display:flex;align-items:center;gap:9px}
.tray-ink{width:24px;height:24px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 2px #fff}
.tray-ink.rec::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#ef4444;margin:-14px 0 0 16px;box-shadow:0 0 0 2px #fff}
.win{position:absolute;background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(15,23,42,.16),0 0 0 1px rgba(15,23,42,.08);overflow:hidden}
.win-title{height:34px;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:12px;color:#374151;background:#f6f6f4;border-bottom:1px solid #ececea}
.win-title .dots{margin-left:auto;display:flex;gap:12px;color:#9ca3af}
.win-tools{display:flex;gap:6px;padding:7px 10px;background:#fafaf9;border-bottom:1px solid #f0efed}
.win-tools span{font-size:11.5px;padding:4px 9px;border-radius:6px;background:#fff;border:1px solid #e5e7eb;color:#374151}
.paper{position:absolute;left:40px;right:40px;top:84px;bottom:0;background:#fff;padding:26px 34px;border:1px solid #efefed;border-bottom:0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.paper h2{margin:0 0 10px;font-size:22px;color:#111827}
.paper p{margin:0 0 14px;font-size:13.5px;line-height:1.7;color:#374151;max-width:640px}
.qbox{display:flex;gap:18px;align-items:flex-start;padding:14px;border:2px solid #fde68a;border-radius:10px;background:#fffbeb;margin-bottom:16px;width:720px}
.qbox .qtext{font-size:14px;line-height:1.7;flex:1}
.qbox .fig{width:190px;height:96px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:8px;background:#fef3c7}
.qbox .fig i{border-radius:4px;background:#f59e0b}
.qbox .fig i.e{background:#fde68a}
table.tb{border-collapse:collapse;font-size:13px;width:720px}
table.tb th,table.tb td{border:1px solid #e5e7eb;padding:8px 10px;text-align:center}
table.tb th{background:#f4ebce;color:#78350f}
.slide{position:absolute;inset:34px 0 0 0;padding:16px;background:#f3f4f6}
.slide .sl{height:170px;border-radius:8px;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:16px;font-size:18px;font-weight:700}
.slide .sl small{display:block;font-size:12px;font-weight:400;opacity:.8;margin-top:6px}
.notice{padding:14px;font-size:12.5px;line-height:1.7;color:#374151}
.notice b{color:#0369a1}

/* ── 공통: 알림 말풍선(Tidy UndoToast 말씨) ── */
.toasts{position:absolute;left:0;right:0;bottom:64px;display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:40}
.toast{pointer-events:auto;display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 6px 4px 6px;border-radius:999px;border:1.5px solid rgba(120,80,20,.18);background:#fffdf8;background-image:radial-gradient(rgba(120,80,20,.075) 1px,transparent 1.3px);background-size:8px 8px;box-shadow:0 2px 0 rgba(120,80,20,.22),0 8px 20px rgba(15,23,42,.1);font-size:13px;font-weight:700;color:#7c4a12;animation:pop .28s var(--spring)}
.toast .seat{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,#fff1e6);color:var(--accent)}
.toast .seat.bad{background:#fee2e2;color:#b91c1c}
.toast .seat.good{background:#dcfce7;color:#047857}
.toast .act{border:0;border-radius:99px;border-bottom:2px solid color-mix(in srgb,var(--accent) 62%,black);background:var(--accent);color:#fff;font-weight:800;font-size:12px;padding:5px 11px;cursor:pointer}
.toast .msg{padding-right:6px}
.toast small{display:block;font-size:11px;font-weight:600;color:#a16207}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.94)}}
.bubble{position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 14px 6px 7px;border-radius:99px;background:rgba(255,253,248,.96);border:1.5px solid rgba(120,80,20,.16);box-shadow:0 2px 0 rgba(120,80,20,.2),0 10px 24px rgba(15,23,42,.14);font-size:13px;font-weight:800;color:#7c4a12;z-index:30;transition:opacity .15s}
.bubble .dot{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 3px #fff,0 0 0 1.5px rgba(0,0,0,.12)}
.bubble .sep{opacity:.35}
.bubble.hide{opacity:0}

/* ── 설정 창 (Tidy SettingsModal 구조) ── */
.st-win{position:absolute;width:600px;height:760px;border-radius:14px;background:var(--bg);box-shadow:0 18px 50px rgba(15,23,42,.22),inset 0 0 0 1px var(--border);display:flex;flex-direction:column;overflow:hidden;font-size:13px;line-height:1.5;word-break:keep-all}
.st-head{display:flex;align-items:center;gap:8px;padding:11px 10px 8px 14px}
.st-head h1{margin:0;font-size:13.5px;font-weight:700;flex:1}
.st-logo{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff}
.st-close{width:28px;height:28px;border:0;border-radius:9px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.st-close:hover{background:var(--hover)}
.st-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:0 12px;padding:3px;border-radius:12px;background:var(--chrome)}
.st-tab{display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 4px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;position:relative}
.st-tab.on{background:var(--field);color:var(--accent);box-shadow:0 1px 3px rgba(15,23,42,.14)}
.st-tab .pd{position:absolute;top:5px;right:14px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.st-body{flex:1;overflow-y:auto;padding:10px 12px 12px}
.st-body::-webkit-scrollbar{width:5px}.st-body::-webkit-scrollbar-thumb{background:var(--track);border-radius:10px}
.st-page{display:flex;flex-direction:column;gap:9px;animation:pagein .16s ease-out}
@keyframes pagein{from{opacity:0;transform:translateY(4px)}}
.set{display:grid;gap:7px}
.set>header{display:flex;align-items:center;gap:6px;min-height:22px}
.set>header h2{margin:0;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:800;line-height:1.6}
.set>header .tag{padding:1px 8px;border:1.5px dashed var(--accent-line);border-radius:99px;color:var(--muted);font-size:10px;font-weight:700}
.set>header .side{margin-left:auto;color:var(--muted);font-size:11px;font-weight:700}
.panel{padding:10px;border:1px solid var(--line);border-radius:17px;background:var(--panel);box-shadow:0 2px 7px rgba(15,23,42,.025)}
.panel>header{display:flex;align-items:center;gap:9px}
.panel .identity{flex:1;min-width:0}
.panel h3{margin:0;font-size:12.5px;font-weight:800;display:flex;gap:6px;align-items:center}
.panel h3 .tag{border-radius:99px;padding:1px 6px;background:var(--accent-soft);color:var(--accent);font-size:9.5px;font-weight:700}
.panel h3 .tag.later{background:rgba(15,23,42,.06);color:var(--muted)}
.panel small.cap{display:block;margin-top:1px;color:var(--muted);font-size:10.5px}
.panel .content{margin-top:8px;display:grid;gap:5px}
.bubble-ic{flex:none;width:30px;height:30px;border-radius:37%;display:grid;place-items:center;background:color-mix(in srgb,var(--tone) 13%,#fff);color:color-mix(in srgb,var(--tone) 90%,var(--ink))}
.row{width:100%;min-height:42px;display:flex;align-items:center;gap:10px;padding:5px 11px 5px 8px;border:0;border-radius:16px;background:var(--piece);text-align:left;cursor:pointer}
.row:hover{background:var(--piece-hover)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row strong{font-size:12px;font-weight:700}
.row small{font-size:10.5px;color:var(--muted);line-height:1.45}
.row[aria-checked=false] .bubble-ic{filter:grayscale(.85);opacity:.7}
.row[disabled]{opacity:.55;cursor:default}
.knob{flex:none;position:relative;width:36px;height:22px;border-radius:99px;background:var(--track);transition:background .18s}
.knob i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .2s var(--spring)}
.row[aria-checked=true] .knob{background:var(--accent)}
.row[aria-checked=true] .knob i{transform:translateX(14px)}
.field{display:grid;grid-template-columns:6.2em minmax(0,1fr);align-items:center;gap:8px;padding:4px 2px}
.field>span{font-size:11.5px;font-weight:700;color:var(--sub)}
.inp{width:100%;padding:.48em .7em;border:1px solid var(--line);border-radius:9px;background:var(--field);font-size:12px;outline:none}
.inp:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-grid;grid-auto-flow:column;gap:3px;padding:3px;border-radius:11px;background:var(--chrome)}
.seg button{border:0;border-radius:8px;background:transparent;padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--field);color:var(--accent);box-shadow:0 1px 3px rgba(15,23,42,.14)}
.slider{display:flex;align-items:center;gap:9px}
.slider input{flex:1;accent-color:var(--accent)}
.val{min-width:3.4em;padding:1px 6px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;text-align:center}
.st-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:.55em 1.1em;border:1px solid transparent;border-radius:10px;background:var(--hover);color:var(--sub);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.st-btn.sm{padding:.4em .8em;border-radius:8px;font-size:11px}
.st-btn.primary{background:var(--accent-fill);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 28%,transparent)}
.st-btn.outline{background:var(--field);border-color:var(--line);color:var(--accent)}
.st-btn.danger{background:transparent;border-color:var(--danger-line);color:var(--danger)}
.st-btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.st-foot{display:flex;align-items:center;gap:8px;padding:10px 12px 12px 16px;border-top:1px solid var(--line-soft);background:var(--chrome)}
.st-pending{flex:1;margin:0;color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.st-pending i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.st-pending.none{color:var(--muted)}.st-pending.none i{background:var(--track)}
/* 단축키 줄 */
.krow{display:grid;grid-template-columns:30px minmax(0,1fr) auto 22px;align-items:center;gap:9px;padding:5px 8px;border-radius:16px;background:var(--piece)}
.krow.bad{background:var(--danger-soft);box-shadow:inset 0 0 0 1px var(--danger-line)}
.krow .rt strong{font-size:12px}.krow .rt small{display:block;font-size:10.5px;color:var(--muted)}
.krow.bad .rt small{color:var(--danger);font-weight:700}
.kchip{min-width:86px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:5px 10px;border-radius:10px;border:1px solid var(--line);border-bottom-width:2px;background:var(--field);font-weight:800;font-size:12px;cursor:pointer}
.kchip.rec{border-color:var(--accent);color:var(--accent);animation:blink 1s infinite}
.kchip.empty{color:var(--muted);font-weight:600;border-style:dashed}
.kchip.sm{min-width:54px;padding:3px 8px;font-size:11px}
.ktag{font-size:9.5px;font-weight:700;border-radius:99px;padding:1px 6px;background:rgba(15,23,42,.06);color:var(--muted);vertical-align:1px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 4px 3px 8px;border-radius:10px;background:var(--piece);font-size:11px;font-weight:700}
.mrow small{display:block;font-size:10px;color:var(--danger);font-weight:700}
.mrow.bad{background:var(--danger-soft);box-shadow:inset 0 0 0 1px var(--danger-line)}
.panel.bad{box-shadow:inset 0 0 0 1px var(--danger-line)}
.conflict .snip{margin:0;font-size:11px;line-height:1.7;color:var(--sub)}
.conflict .snip b{font-size:inherit;color:var(--text)}
.conflict .snip .chip{margin-left:4px}
@keyframes blink{50%{box-shadow:0 0 0 4px var(--accent-soft)}}
.kstat{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.kstat.ok{background:#dcfce7;color:#047857}.kstat.bad{background:#fee2e2;color:#b91c1c}.kstat.off{background:var(--hover);color:var(--muted)}
.conflict{padding:10px 12px;border-radius:14px;border:1.5px dashed var(--danger-line);background:#fff7f6;display:grid;gap:7px}
.conflict b{font-size:12px;color:var(--danger)}
.conflict p{margin:0;font-size:11px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--field);font-size:11px;font-weight:700;color:var(--sub);cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip.tok{font-family:Consolas,monospace;font-weight:600}
.colors{display:flex;gap:7px}
.color{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(15,23,42,.14);position:relative;cursor:pointer}
.color b{position:absolute;right:-5px;bottom:-5px;width:15px;height:15px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:9px;display:grid;place-items:center;color:var(--ink)}
.color.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.card{padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer;display:grid;gap:2px}
.card.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.card strong{font-size:12px}.card small{font-size:10px;color:var(--muted)}
.preview{font-family:Consolas,monospace;font-size:11px;padding:6px 9px;border:1px dashed var(--line);border-radius:9px;background:var(--field);color:var(--sub)}
.preview b{color:var(--accent)}
.status-card{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:13px;border:1px solid var(--accent-line);background:var(--accent-soft)}
.status-card strong{font-size:12px}.status-card small{display:block;font-size:10.5px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px 0;justify-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(15,23,42,.14);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c3)}

/* ── 트레이 메뉴 ── */
.tray-menu{position:absolute;right:20px;bottom:56px;width:300px;padding:8px;border-radius:16px;background:var(--bg);box-shadow:0 18px 44px rgba(15,23,42,.24),inset 0 0 0 1px var(--border);font-size:12.5px}
.tm-head{display:flex;align-items:center;gap:9px;padding:6px 8px 9px}
.tm-head strong{font-size:13px}.tm-head small{display:block;font-size:10.5px;color:var(--good);font-weight:700}
.tm-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:10px;cursor:pointer}
.tm-item:hover{background:var(--piece-hover)}
.tm-item .k{margin-left:auto;font-size:11px;font-weight:800;color:var(--muted)}
.tm-item .ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--tone) 13%,#fff);color:color-mix(in srgb,var(--tone) 90%,var(--ink))}
.tm-sep{height:1px;background:var(--line-soft);margin:5px 6px}
.tm-item.dis{opacity:.45}

/* ── 캡처 오버레이 ── */
.cap-ov{position:absolute;inset:0;z-index:20;cursor:crosshair}
.cap-ov.dim{background:rgba(15,23,42,.34)}
.cap-sel{position:absolute;border:2px solid var(--accent);border-radius:2px;box-shadow:0 0 0 9999px rgba(15,23,42,.34);pointer-events:none;transition:all .08s ease-out;display:none}
.cap-sel.on{display:block}
.cap-sel.fixed{border-style:solid}
.cap-sel .hd{position:absolute;width:9px;height:9px;border-radius:3px;background:#fff;border:2px solid var(--accent)}
.cap-badge,.cap-crumb{position:absolute;display:none;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:rgba(255,253,248,.97);border:1.5px solid rgba(120,80,20,.16);box-shadow:0 2px 0 rgba(120,80,20,.18);font-size:11.5px;font-weight:800;color:#7c4a12;white-space:nowrap;pointer-events:none}
.cap-badge.on,.cap-crumb.on{display:flex}

.mag{position:absolute;width:132px;height:162px;border-radius:14px;background:#fffdf8;box-shadow:0 10px 28px rgba(15,23,42,.28),0 0 0 1.5px rgba(120,80,20,.2);overflow:hidden;pointer-events:none;display:none}

/* ── 판서·칠판·실시간 확대 ── */
.dz-wrap{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
.dz-bg{position:absolute;inset:0}
.dz-bg.board-w{background:#fff}.dz-bg.board-k{background:#1f2a24}
.dz-canvas{position:absolute;inset:0}
.pen-cursor{position:absolute;border-radius:50%;pointer-events:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);transform:translate(-50%,-50%);z-index:25}
.zoom-badge{position:absolute;right:18px;bottom:60px;padding:5px 12px;border-radius:99px;background:rgba(255,253,248,.97);border:1.5px solid rgba(120,80,20,.16);box-shadow:0 2px 0 rgba(120,80,20,.2);font-size:12px;font-weight:800;color:#7c4a12;z-index:30}
.live-frame{position:absolute;inset:0;box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--accent) 60%,transparent);pointer-events:none;z-index:24}
.mode-edge{position:absolute;inset:0;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent);pointer-events:none;z-index:24}
.rec-region{position:absolute;border:2px dashed #ef4444;border-radius:4px;pointer-events:none;z-index:24}
.rec-pill{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:5px 6px 5px 12px;border-radius:99px;background:rgba(255,253,248,.98);border:1.5px solid rgba(185,28,28,.25);box-shadow:0 2px 0 rgba(185,28,28,.2),0 10px 24px rgba(15,23,42,.16);font-size:12.5px;font-weight:800;color:#7f1d1d;z-index:30}

@keyframes recb{50%{opacity:.35}}
.rec-pill button{border:0;border-radius:99px;padding:4px 10px;background:#ef4444;color:#fff;font-weight:800;font-size:11.5px;border-bottom:2px solid #991b1b;cursor:pointer}

/* ── 첫 실행 · 단축키 안내 ── */
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.28);z-index:35}

.cheat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:980px;padding:16px 18px;border-radius:20px;background:rgba(253,250,243,.98);box-shadow:0 24px 60px rgba(15,23,42,.3),inset 0 0 0 1px var(--border);z-index:36}
.cheat h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.cheat .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.cheat .col h3{margin:0 0 6px;font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);display:inline-block;padding:1px 9px;border-radius:99px}

.cheat .ln:last-child{border-bottom:0}
.gallery{position:absolute;left:60px;top:60px;right:60px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px 30px;z-index:30}
.gallery .item{display:grid;gap:6px;justify-items:start}
.gallery .item>small{font-size:11px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.7);padding:2px 8px;border-radius:99px}
.gallery .toast{animation:none}
.label-pin{position:absolute;padding:3px 9px;border-radius:99px;background:#1f2937;color:#fff;font-size:11px;font-weight:700;z-index:45;white-space:nowrap}
.label-pin::before{content:attr(data-n);display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--accent);margin-right:6px;font-size:10px}
</style>
</head>
<body>
<div class="topbar" id="topbar"><b>screen-ink 시안</b></div>
<div class="howto" id="howto"></div>
<div id="stage"></div>

<script>
'use strict';
const SHOT = new URLSearchParams(location.search).has('shot');
if (SHOT) document.body.classList.add('shot');

/* ── 아이콘(직접 그린 단순 선 아이콘) ── */
const P = {
  crop:'<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/>',
  win:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20"/>',
  video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/>',
  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  zoom:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/>',
  board:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  key:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',
  palette:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.2"/><circle cx="12" cy="7.5" r="1.2"/><circle cx="16" cy="10" r="1.2"/><path d="M12 21a3 3 0 0 1 0-6h2"/>',
  spark:'<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8Z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7Z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
  power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  magnet:'<path d="M6 15a6 6 0 0 0 12 0V4h-4v11a2 2 0 0 1-4 0V4H6Z"/><path d="M6 8h4M14 8h4"/>',
  layers:'<path d="m12 2-10 5 10 5 10-5Z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
  save:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/>',
  cursor:'<path d="m4 4 7 17 2.5-7.5L21 11Z"/>',
  ruler:'<path d="M3 17 17 3l4 4L7 21Z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/>',
  eraser:'<path d="m7 21-4-4L14 6l5 5-9 10Z"/><path d="M7 21h13"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4M12 17h.01"/>',
  pin:'<path d="M12 17v5"/><path d="M5 17h14l-2-4V5h1V3H6v2h1v8Z"/>',
};
const ic = (n, s = 16, w = 2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;
const bub = (n, tone = 'accent', s = 30) => `<span class="bubble-ic" style="--tone:var(--${tone === 'accent' ? 'accent' : 'tone-' + tone});width:${s}px;height:${s}px">${ic(n, Math.round(s * .52))}</span>`;
const kbd = (k) => k.split('+').map((p) => `<kbd>${p}</kbd>`).join('+');

/* ── 가짜 바탕 화면 ── */
function deskInner(opts = {}) {
  return `
  <div class="win" data-el="교재 뷰어 창" data-kind="window" style="left:90px;top:54px;width:900px;height:740px">
    <div class="win-title" data-el="제목 표시줄">${ic('box', 14)} 교재 뷰어 — 5학년 수학 3단원.pdf<span class="dots">─ ▢ ✕</span></div>
    <div class="win-tools" data-el="도구 모음"><span data-el="이전 쪽 단추">◀ 이전</span><span data-el="다음 쪽 단추">다음 ▶</span><span data-el="확대 단추">확대 125%</span><span data-el="검색 상자" style="width:180px">🔍 검색</span></div>
    <div class="paper" data-el="쪽 (p.42)">
      <h2 data-el="제목" data-smart="text">3. 분수의 나눗셈</h2>
      <p data-el="문단" data-smart="text">(분수) ÷ (분수)는 나누는 수를 뒤집어 곱셈으로 바꾸어 계산할 수 있어요. 아래 문제를 그림과 함께 생각해 봅시다.</p>
      <div class="qbox" data-el="문제 1 상자">
        <div class="qtext" data-el="문제 글" data-smart="text"><b>문제 1.</b> 끈 3/4 m를 1/8 m씩 자르면 몇 도막이 될까요?<br>식을 쓰고 답을 구해 보세요.</div>
        <div class="fig" data-el="그림" data-smart="color"><i></i><i></i><i></i><i class="e"></i><i></i><i></i><i></i><i class="e"></i></div>
      </div>
      <table class="tb" data-el="표" data-smart="table">
        <thead data-el="머리 행"><tr><th>나누어지는 수</th><th>나누는 수</th><th>곱셈으로 바꾸기</th><th>몫</th></tr></thead>
        <tbody data-el="본문">
          <tr data-el="1행"><td data-el="칸">3/4</td><td data-el="칸">1/8</td><td data-el="칸">3/4 × 8/1</td><td data-el="칸">6</td></tr>
          <tr data-el="2행"><td data-el="칸">2/3</td><td data-el="칸">1/6</td><td data-el="칸">2/3 × 6/1</td><td data-el="칸">4</td></tr>
          <tr data-el="3행"><td data-el="칸">5/6</td><td data-el="칸">5/12</td><td data-el="칸">?</td><td data-el="칸">?</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="win" data-el="PowerPoint 창" data-kind="window" style="left:1020px;top:70px;width:380px;height:300px">
    <div class="win-title" data-el="제목 표시줄">${ic('video', 14)} 수업 슬라이드 — PowerPoint<span class="dots">─ ▢ ✕</span></div>
    <div class="slide" data-el="슬라이드 영역"><div class="sl" data-el="슬라이드 3" data-smart="text">오늘의 목표<small>분수의 나눗셈 원리를 그림으로 설명하기</small></div></div>
  </div>
  <div class="win" data-el="쿨메신저 알림 창" data-kind="window" style="left:1020px;top:400px;width:380px;height:190px">
    <div class="win-title" data-el="제목 표시줄">${ic('alert', 14)} 쿨메신저 — 알림</div>
    <div class="notice" data-el="알림 내용" data-smart="text"><b>[교무부]</b> 내일(11/26) 3교시 공개수업 참관록은 수업 후 30분 안에 제출해 주세요. 양식은 공유 폴더에 있습니다.</div>
  </div>
  <div class="taskbar" data-el="작업 표시줄"><span>⊞</span><span class="apps"><i></i><i></i><i></i><i></i><i></i></span><span class="tray"><span>🔈</span><span>한</span><span class="tray-ink${opts.rec ? ' rec' : ''}" style="position:relative">${ic('pen', 13, 2.6)}</span><span>10:31</span></span></div>`;
}
function deskHTML(opts = {}) { return `<div class="desk" id="desk">${deskInner(opts)}<div class="toasts" id="toasts"></div></div>`; }

/* ── 알림 말풍선 ── */
function toast(html, kind = '', action = '', ms = 2600) {
  const box = document.getElementById('toasts'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast';
  const icon = kind === 'bad' ? 'alert' : kind === 'good' ? 'check' : 'spark';
  el.innerHTML = `<span class="seat ${kind}">${ic(icon, 14, 2.6)}</span><span class="msg">${html}</span>${action ? `<button class="act">${action}</button>` : ''}`;
  box.appendChild(el);
  if (!SHOT && ms) setTimeout(() => el.remove(), ms);
  return el;
}

/* ── 라우터 ── */
let cleanup = null;
const stage = document.getElementById('stage');
const howto = document.getElementById('howto');
function on(target, ev, fn, opt) { target.addEventListener(ev, fn, opt); const prev = cleanup; cleanup = () => { target.removeEventListener(ev, fn, opt); prev && prev(); }; }

const SCREENS = [];
function screen(id, title, guide, render) { SCREENS.push({ id, title, guide, render }); }

function go() {
  const id = (location.hash || '#s01').slice(1);
  const sc = SCREENS.find((s) => s.id === id) || SCREENS[0];
  if (cleanup) { cleanup(); cleanup = null; }
  stage.innerHTML = '';
  howto.innerHTML = `<b>${sc.id.toUpperCase()} · ${sc.title}</b> — ${sc.guide}`;
  document.querySelectorAll('#topbar a').forEach((a) => a.classList.toggle('on', a.getAttribute('href') === '#' + sc.id));
  sc.render(stage);
}

/* ═══════════ S01 트레이 메뉴 ═══════════ */
screen('s01', '트레이 메뉴', '트레이 아이콘을 누르면 뜨는 메뉴. 모든 기능을 단축키 없이도 시작할 수 있다. "단축키 잠시 끄기"를 눌러 보세요.', (st) => {
  st.innerHTML = deskHTML();
  const desk = st.querySelector('#desk');
  const items = [
    ['crop', 'peach', '범위 캡처', 'F1'], ['win', 'sky', '창 캡처', 'F2'], ['video', 'rose', '화면 녹화', 'F3'], null,
    ['pen', 'accent', '판서', 'Alt+1'], ['zoom', 'lilac', '화면 확대', 'Alt+2'], ['board', 'mint', '칠판', 'Alt+3'], null,
    ['undo', 'gold', '직전 판서 다시 열기', 'Ctrl+Shift+R'], ['clock', 'sky', '캡처 기록 지우기', ''], ['folder', 'gold', '저장 폴더 열기', ''], null,
  ];
  let paused = false;
  const menu = document.createElement('div');
  menu.className = 'tray-menu';
  const draw = () => {
    menu.innerHTML = `<div class="tm-head"><span class="st-logo" style="width:30px;height:30px;border-radius:10px">${ic('pen', 16, 2.6)}</span><span><strong>screen-ink</strong><small style="color:${paused ? 'var(--muted)' : 'var(--good)'}">${paused ? '단축키 꺼짐 — 메뉴로만 시작' : '단축키 켜짐 · 커서 있는 모니터에서 작동'}</small></span></div>`
      + items.map((it) => it ? `<div class="tm-item${paused && it[3] ? ' dis' : ''}"><span class="ic" style="--tone:var(--${it[1] === 'accent' ? 'accent' : 'tone-' + it[1]})">${ic(it[0], 14)}</span>${it[2]}<span class="k">${it[3]}</span></div>` : '<div class="tm-sep"></div>').join('')

  return { html: out + '.png', bad };
}

function renderSettings(st, tab, preset) {
  settingsState.tab = tab;
  st.innerHTML = deskHTML();
  const desk = st.querySelector('#desk');
  const win = document.createElement('div');
  win.className = 'st-win';
  win.style.left = '420px'; win.style.top = '50px';
  desk.appendChild(win);
  const body = () => ({ keys: tabKeys, draw: tabDraw, capture: tabCapture, general: tabGeneral })[settingsState.tab]();
  const draw = () => {
    const pend = settingsState.pending.size;
    win.innerHTML = `<header class="st-head"><span class="st-logo">${ic('pen', 13, 2.6)}</span><h1>screen-ink 설정</h1><button class="st-close">${ic('x', 15)}</button></header>
      <div class="st-tabs">${SETTINGS_TABS.map(([id, label, i]) => `<button class="st-tab${settingsState.tab === id ? ' on' : ''}" data-tab="${id}">${ic(i, 14)}${label}${[...settingsState.pending].some((p) => p.startsWith(id)) ? '<i class="pd"></i>' : ''}</button>`).join('')}</div>
      <div class="st-body"><div class="st-page">${body()}</div></div>
      <footer class="st-foot"><p class="st-pending${pend ? '' : ' none'}"><i></i>${pend ? `적용 전 변경 ${pend}개` : '모두 적용됐어요'}</p><button class="st-btn">취소</button><button class="st-btn outline" ${pend ? '' : 'disabled'} id="apply">적용</button><button class="st-btn primary" id="done">완료</button></footer>`;
    bind();
  };
  const mark = (k) => { settingsState.pending.add(k); };
  const bind = () => {
    win.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { settingsState.tab = b.dataset.tab; settingsState.recording = null; draw(); });
    win.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { settingsState.recording = b.dataset.k; draw(); });
    win.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => { settingsState.openGroup = settingsState.openGroup === b.dataset.open ? null : b.dataset.open; settingsState.recording = null; draw(); });
    win.querySelectorAll('[data-mk]').forEach((b) => b.onclick = () => { settingsState.recording = 'm:' + b.dataset.mk; draw(); });
    win.querySelectorAll('[data-snip]').forEach((b) => b.onclick = () => toast('Snipaste 트레이 아이콘 → 설정 → 일반 → "시작 시 실행" 끄기 · 다음부터 F1은 screen-ink가 받아요'));
    win.querySelectorAll('[data-fix]').forEach((b) => b.onclick = () => { const r = settingsState.keys.find((x) => x.id === b.dataset.fix); r.key = b.dataset.v; mark('keys.' + r.id); draw(); toast(`‘${r.label}’을 ${r.key}로 바꿨어요 · [적용]을 누르면 등록돼요`); });
    win.querySelectorAll('[data-sw]').forEach((b) => b.onclick = () => { if (b.disabled) return; const [g, k] = b.dataset.sw.split('.'); settingsState[g][k] = !settingsState[g][k]; mark(b.dataset.sw); draw(); });
    win.querySelectorAll('[data-seg] button').forEach((b) => b.onclick = () => { const name = b.parentElement.dataset.seg; const g = settingsState.tab === 'draw' ? 'draw' : 'capture'; settingsState[g][name] = name === 'esc' ? (b.dataset.v === '한 단계씩' ? 'step' : 'exit') : b.dataset.v; mark(g + '.' + name); draw(); });
    win.querySelectorAll('[data-range]').forEach((r) => r.oninput = () => { const [g, k] = r.dataset.range.split('.'); settingsState[g][k] = +r.value; mark(r.dataset.range); draw(); win.querySelector(`[data-range="${r.dataset.range}"]`).focus(); });
    win.querySelectorAll('[data-color]').forEach((b) => b.onclick = () => { settingsState.draw.color = b.dataset.color; mark('draw.color'); draw(); });
    win.querySelectorAll('[data-result]').forEach((b) => b.onclick = () => { settingsState.capture.result = b.dataset.result; mark('capture.result'); draw(); });
    win.querySelectorAll('[data-theme]').forEach((b) => b.onclick = () => { settingsState.general.theme = b.dataset.theme; mark('general.theme'); draw(); });
    win.querySelectorAll('[data-tok]').forEach((b) => b.onclick = () => { settingsState.capture.template += b.dataset.tok; mark('capture.template'); draw(); });
    const tpl = win.querySelector('#tpl');
    if (tpl) tpl.oninput = () => { settingsState.capture.template = tpl.value; mark('capture.template'); const pv = previewName(tpl.value); win.querySelector('#pv').innerHTML = pv.bad ? '<span style="color:var(--danger);font-weight:700">파일 이름에 쓸 수 없는 글자(\\ / : * ? " &lt; &gt; |)가 있어요</span>' : '미리보기 · ' + pv.html; };
    const ch = win.querySelector('#clearHist'); if (ch) ch.onclick = () => toast('캡처 기록 20개를 지웠어요', '', '되돌리기', 6000);
    const ap = win.querySelector('#apply'); if (ap) ap.onclick = () => { const bad = settingsState.keys.filter((r) => keyStatus(r).cls === 'bad').length; settingsState.pending.clear(); draw(); toast(bad ? `적용했어요 · 겹치는 키 ${bad}개는 등록하지 못했어요` : '적용했어요 · 새 단축키를 바로 쓸 수 있어요', bad ? 'bad' : 'good'); };
  };
  on(window, 'keydown', (e) => {
    if (!settingsState.recording) return;
    e.preventDefault();
    if (settingsState.recording.startsWith('m:')) { // 모드 안 키: 글자 하나도 됨
      const [, g, id] = settingsState.recording.split(':');
      const mr = settingsState.modeKeys[g].find((x) => x.id === id);
      if (e.key === 'Escape' && !e.ctrlKey && !e.altKey && !e.shiftKey) { settingsState.recording = null; draw(); return; }
      if (e.key === 'Backspace' || e.key === 'Delete') { mr.key = ''; settingsState.recording = null; mark(`keys.mode.${g}.${id}`); draw(); return; }
      const mc = comboFrom(e); if (!mc) return;
      mr.key = mc; settingsState.recording = null; mark(`keys.mode.${g}.${id}`); draw();
      const st = modeStatus(g, mr); if (st) toast(`‘${mr.label}’ ${kshow(mc)} — ${st}`, 'bad');
      return;
    }
    const r = settingsState.keys.find((x) => x.id === settingsState.recording);
    if (e.key === 'Escape') { settingsState.recording = null; draw(); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') { r.key = ''; settingsState.recording = null; mark('keys.' + r.id); draw(); toast(`‘${r.label}’ 단축키를 비웠어요 · 트레이 메뉴로 시작할 수 있어요`); return; }
    const combo = comboFrom(e); if (!combo) return;
    r.key = combo; settingsState.recording = null; mark('keys.' + r.id); draw();
  });
  if (preset) preset(draw);
  draw();
}
