[package]
name = "ink-platform-windows"
description = "screen-ink Windows 어댑터: 실행 중인 앱(이름만)·PowerToys 설정 파일의 전역 키·작업 표시줄 밝기"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ink-app.workspace = true
ink-domain.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com"] }
windows-sys = { version = "0.59", features = [
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_RemoteDesktop",
  "Win32_System_LibraryLoader",
  "Win32_System_StationsAndDesktops",
] }
